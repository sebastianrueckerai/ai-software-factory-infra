apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform, namespace: flux-system}
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  # Ready, and the commit status flux/platform with it, only once every
  # applied object is healthy, the HelmReleases included. The timeout leaves
  # the slowest HelmRelease its own 15m.
  wait: true
  timeout: 20m
  path: ./k8s/platform
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
