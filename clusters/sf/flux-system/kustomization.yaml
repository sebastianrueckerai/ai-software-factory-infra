apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Multi-tenancy lockdown (ruling 157, Task 65 m9): a Kustomization without
# serviceAccountName runs as the target namespace's default account, and
# remote bases are refused. The factory's own Kustomizations name the
# controller's account; project ones name `flux` in their namespace.
# Patches here survive `flux bootstrap`, which rewrites only the gotk files.
patches:
- target: {kind: Deployment, name: kustomize-controller}
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --no-remote-bases=true
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --default-service-account=default
- target: {kind: Kustomization, name: flux-system}
  patch: |
    - op: add
      path: /spec/serviceAccountName
      value: kustomize-controller
# The controllers pinned by digest at the upstream (the code repository's
# upstream-images.txt, bootstrap): Flux applies Forgejo, which serves the
# factory's store.
images:
- {name: ghcr.io/fluxcd/source-controller, digest: "sha256:b2ac269f9d13d82514bcbf0e7057a4ae1d98504058b9353cead7e2452a64384f"}
- {name: ghcr.io/fluxcd/kustomize-controller, digest: "sha256:ed11ebded23c9e9fe475f7d54b08cc34697e8f01bcd5cfd144fd5aef7b5d8f0d"}
- {name: ghcr.io/fluxcd/helm-controller, digest: "sha256:2ba739b5c0df833dcd463fc1984673f506a5fd0aff64c2f8b28d528b0796f066"}
- {name: ghcr.io/fluxcd/notification-controller, digest: "sha256:69e484e937549694240d5754541feed0993a162000dbc07e7e262b9f41340348"}
