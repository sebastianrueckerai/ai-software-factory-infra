# yaml-language-server: $schema=../schema/project.schema.json
# The factory's own code: its objects are the infra repository's and the
# seed's, agents fix it, and the console's autonomy dial sets
# who approves a merge. Its namespace factory is factoryd's own: this is the
# factory's own project.
# It works like any build project (roadmap 160, Stage 18 item 3.4): a spec
# card runs on the plan track, its planned cards on the direct track.
repository: sf/ai-software-factory-code
merge_rule: human
objects: seed
agents: coder
process: spec
# the security audit stage reads every pull request before the card
audit: true
namespaces: [factory]
# factory-ci's registrar token reads the writers and the hooks and runs
# the Actions; factory-merge's merges; factory-chat's is the project
# agent's own in a turn no member started
tokens: {read: forgejo-ci-registrar, actions: forgejo-ci-registrar, merge: forgejo-merge, gate: forgejo-gate, chat: forgejo-chat}
# the factory's document repository: the chat's documents, and what its
# agent sessions read at /workspace/docs
chat: {doc_repo: sf/ai-software-factory}
routines:
  - name: weekly-bump
    title: Weekly bump of the pinned outside inputs
    schedule:
      - cron: "0 6 * * 1"
    files: human
    brief: routines/weekly-bump.md
    while_open: hold
    missed: file-once
    tell: inbox
autonomy: manual
# the roll's commit status rides the chain: the head is green only when the
# run is green and the roll succeeded; 24h covers human approval
chain: {requires: [factory/roll], stall: 24h}
images:
  chromium:
    digest: sha256:acaa9de045a0f4ead85edae4f6a2dd6dfa0f554791fb2f23e7f1303e54d7cc61
    key: k-16107b75dff53d807ec1ffcb
    tools:
      - chromium
      - fonts-liberation
      - go
      - node
    egress:
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      - registry.npmjs.org
# where a session's commands go, for the metrics page's session time: the
# first class that matches wins; check and check_changed make the check
# share, and check holds the full suite's runs, so its median is the full
# check's
commands:
  classes:
    - name: check_changed
      match: ['(^|[;&|(\s])(bash\s+(\./)?check|\./check)\s+changed(\s|$)']
    - name: check_static
      match: ['(^|[;&|(\s])(bash\s+(\./)?check|\./check)\s+static(\s|$)']
    - name: check
      match: ['(^|[;&|(\s])(bash\s+(\./)?check|\./check)(\s|$)', '(^|[;&|(\s])make\s+test(\s|$)']
    - name: go_test
      match: ['(^|[;&|(\s])go\s+test(\s|$)']
queue_cap: 18
refill_below: 6
work_in_progress: 1
