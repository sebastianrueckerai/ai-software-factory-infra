# Pull requests run on the factory's untrusted runners: a fresh gVisor pod,
# no credential beyond the per-run job token, default-deny egress (the Go
# module proxy, the npm registry and, for the image job, the job's own
# build VM and the store's token service). No secrets.* anywhere in this
# file. Registration seeded it from the template ts-go; agents cannot
# change .forgejo/.
#
# Three jobs: checks, job-env-audit, and changes with image. The checks run
# `bash check`, the repository's own; check and Dockerfile absent at both the
# merge base and head skip with one line, present at the merge base and
# absent at head is red.
name: pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  checks:
    # The repository's own check, then the names of added migrations. A
    # deletion is judged against the merge base, so a branch that started
    # before main gained a file does not delete it.
    runs-on: pr-untrusted
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the merge base
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          echo "MERGE_BASE=$(git merge-base "$BASE" HEAD)" >> "$GITHUB_ENV"
      - name: bash check
        run: |
          set -euo pipefail
          if [ ! -f check ]; then
            if git cat-file -e "$MERGE_BASE:check" 2>/dev/null; then echo "check was deleted"; exit 1; fi
            echo "no check: nothing to run"; exit 0
          fi
          bash check
      - name: check still runs gosec and the race tests
        # the agents extend check, never weaken it
        run: |
          set -euo pipefail
          if [ ! -f check ]; then exit 0; fi
          bad=0
          for word in gosec 'go test -race'; do
            if ! grep -qF -- "$word" check; then echo "check no longer runs $word: restore it"; bad=1; fi
          done
          if [ "$bad" = 0 ]; then echo "check runs gosec and go test -race"; fi
          exit "$bad"
      - name: migration names
        # a new .sql file under a migrations/ directory is named by UTC
        # timestamp; files added before this rule keep their names
        run: |
          set -euo pipefail
          bad=0
          for f in $(git diff --name-only --diff-filter=A "$MERGE_BASE" HEAD); do
            case "/$f" in */migrations/*.sql) ;; *) continue ;; esac
            if ! basename "$f" | grep -qxE '[0-9]{14}_[a-z0-9_]+\.sql'; then
              echo "$f: a new migration is named <UTC yyyymmddhhmmss>_<slug>.sql, never by the next number"; bad=1
            fi
          done
          if [ "$bad" = 0 ]; then echo "every added migration is named by timestamp"; fi
          exit "$bad"
  job-env-audit:
    runs-on: pr-untrusted
    steps:
      - name: print job environment variable NAMES only
        run: env | cut -d= -f1 | sort
      # The per-run job token (FORGEJO_TOKEN = GITHUB_TOKEN, plus the runtime
      # token) is the only credential a PR job may hold. forgejo-runner sets
      # ACTIONS_ID_TOKEN_REQUEST_TOKEN and _URL on every job, empty unless the
      # workflow enables enable-openid-connect, which Forgejo overrides to off
      # on a fork's pull request.
      - name: assert no registry or repository write credential
        run: |
          bad=$(env | cut -d= -f1 | grep -Ei '(TOKEN|PASSWORD|PASSWD|SECRET|CREDENTIALS?|AUTH|(^|_)PAT|(^|_)KEY)$|REGISTRY|DOCKER' \
            | grep -Evx 'FORGEJO_TOKEN|GITHUB_TOKEN|GITEA_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN' || true)
          if [ -n "$bad" ]; then echo "credential-shaped variables: $bad"; exit 1; fi
          if [ -e "$HOME/.docker/config.json" ] || [ -e "$HOME/.git-credentials" ]; then echo "credential file in HOME"; exit 1; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "the job can request an OIDC ID token"; exit 1; fi
          echo "only the per-run job token is present"
      - name: assert the job token reads but cannot push
        run: |
          set -eu
          auth="Authorization: Basic $(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          url="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          probe="refs/heads/job-token-probe-$FORGEJO_RUN_ID"
          g() { GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="$auth" git "$@"; }
          git init -q /tmp/probe && cd /tmp/probe
          git -c user.name=probe -c user.email=probe@invalid commit -q --allow-empty -m probe
          if g push -q "$url" "HEAD:$probe" >/tmp/push.log 2>&1; then
            g push -q "$url" ":$probe" || true
            echo "the job token pushed $probe (deleted again): it has repository write access"; exit 1
          fi
          echo "push refused:"; head -n 3 /tmp/push.log | sed "s/$FORGEJO_TOKEN/***/g"
          g ls-remote --exit-code "$url" refs/heads/main >/dev/null
          if g ls-remote --exit-code "$url" "$probe" >/dev/null; then echo "$probe exists"; exit 1; fi
          echo "the job token reads the repository and cannot write it"
  changes:
    # Every pull request of a repository with a Dockerfile builds its image:
    # the Dockerfile is the agents' own, so no list here could name its
    # inputs.
    runs-on: pr-untrusted
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: is there an image to build
        id: select
        run: |
          set -euo pipefail
          base=${{ github.event.pull_request.base.sha }}
          git fetch -q origin "$base"
          if [ -f Dockerfile ]; then
            echo "build image: true"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e "$(git merge-base "$base" HEAD):Dockerfile" 2>/dev/null; then echo "Dockerfile was deleted"; exit 1; fi
          echo "no Dockerfile: no image"
          echo "build=false" >> "$GITHUB_OUTPUT"
  image:
    # Builds only, never pushes. Forgejo hands a job to a runner before its
    # `if` is evaluated, so the label carries the same test: with nothing to
    # build, an ordinary runner skips the job and no build VM is made.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ needs.changes.outputs.build == 'true' && 'pr-untrusted-build' || 'pr-untrusted' }}
    steps:
      - uses: actions/checkout@v4
      - name: wait for the build VM's buildkitd
        run: |
          set -u
          echo "buildkitd at $BUILDKIT_HOST, mTLS, server name $BUILDKIT_TLS_SERVERNAME"
          deadline=$(( $(date +%s) + 180 ))
          until buildctl --tlsdir "$BUILDKIT_TLS_DIR" --tlsservername "$BUILDKIT_TLS_SERVERNAME" debug workers; do
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "buildkitd did not answer within 3 minutes"; exit 1; fi
            sleep 3
          done
      - name: build the image
        # The Dockerfile's bases are the factory store's copies: buildctl
        # answers the VM's registry token requests with the job's own
        # token, which reads them as every signed-in account does and
        # expires with the job.
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d)
          printf '{"auths":{"git.aisoftwarefactory.world":{"auth":"%s"}}}' "$(printf 'job:%s' "$FORGEJO_TOKEN" | base64 -w0)" \
            > "$DOCKER_CONFIG/config.json"
          buildctl --tlsdir "$BUILDKIT_TLS_DIR" --tlsservername "$BUILDKIT_TLS_SERVERNAME" \
            build --progress=plain --frontend dockerfile.v0 --local context=. --local dockerfile=. \
            --output type=oci,dest=/dev/null
