# The sandbox images of this project's agent sessions: the tools on top of
# the factory's base image. The factory builds the project's images from this file.
images:
  default:
    upstream:
      - name: go
        # pin file go
        url: https://go.dev/dl/go1.25.14.linux-amd64.tar.gz
        # pin file go
        sha256: a21ae5633a269bcd7e90cf767e48225633795e99d831742cbf3397064fee7712
        to: /usr/local
        strip: 0
      - name: node
        # pin file node
        url: https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz
        # pin file node
        sha256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
        to: /usr/local
        strip: 1
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    path: [/usr/local/go/bin, /home/worker/go/bin]
    egress: [proxy.golang.org, sum.golang.org, storage.googleapis.com, registry.npmjs.org]
