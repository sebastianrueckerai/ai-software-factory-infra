# yaml-language-server: $schema=schema/workflow.schema.json
# The stages a task's work passes, in order (ruling 177). on_findings:
# agent gives the stage's findings to the next session (the first return
# keeps the model, the next takes the stronger rung, limits.sessions is
# the round cap), human opens the card with them, fail fails the task.
# enabled: false skips a stage (the timeline records it skipped). when:
# outsider runs the stage only on issues by an outside account (the
# screening reads an outsider's issue before the coder, ruling 182).
# review takes no when (enabled: false is its only off switch, backlog 68):
# a review that gives no verdict is a finding on the card.
# max_returns: n caps a stage's own returns to the agent before the card
# (ruling 190); none here, so the session cap decides. policy, approval
# and merge are required, approval right before merge, merge last;
# checks, policy, approval and merge always run; screening is first and
# for a human only. audit (ruling 188) reads the reviewed head for a
# fixed security checklist, between review and approval, its findings for
# a human only; it runs for the projects whose file sets audit: true.
stages:
  - {name: screening, on_findings: human, enabled: true, when: outsider}
  - {name: checks, on_findings: agent, enabled: true}
  - {name: policy, on_findings: fail, enabled: true}
  - {name: migration, on_findings: human, enabled: true}
  - {name: reproduction, on_findings: agent, enabled: true}
  - {name: review, on_findings: agent, enabled: true}
  - {name: audit, on_findings: human, enabled: true}
  - {name: approval, on_findings: human, enabled: true}
  - {name: merge, on_findings: human, enabled: true}
