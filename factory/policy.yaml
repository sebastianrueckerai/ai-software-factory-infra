# yaml-language-server: $schema=schema/policy.schema.json
# Factory policy, schema version 1: part of the configuration tree factory/
# (README "Configuration"). Edit here, commit, push to main: factoryd loads
# the commit within 30 s and the gateway enforces it within 30 s more. A
# refused commit keeps the previous version and files an issue here.
# Unknown keys are rejected; `factoryd config check factory/` shows why.
version: 1

# EUR caps. A task gets task_default_eur unless its intake asks for less or
# more; never more than task_max_eur. day_eur caps all tasks together per
# UTC day and month_eur per UTC calendar month, over the cost ledger (model
# calls, paid tools, commissioned servers); 0 stops all spend. factoryd
# alerts at 50 and 80 percent of month_eur and files a human issue at the
# cap: raising it is a commit here. The coder class must allow factoryd's
# model ladder, or factoryd rejects the version.
budget:
  task_default_eur: 2
  task_max_eur: 5
  day_eur: 20
  month_eur: 50

# Limits on every task's work (rulings 177, 183, 186); a task keeps all of
# them from the version its workflow started under, in every session and
# supervisor or review call too. sessions: agent
# sessions before the task goes to a human with every finding (the round
# cap; a human's answer buys one more). agent_time: the agent's working
# time across its sessions (waiting on checks or a reviewer does not
# count). supervisor_calls: supervisor model calls per session; the next
# trip escalates without one. supervisor_timeout: one supervisor or review
# call, at most 15m. stronger_after: returns from the same stage that keep
# the model; the next takes the stronger rung. steps: model turns per agent
# session (opencode's agent steps); at the cap opencode asks the model to
# summarise and stop. 200 outlasts the agent time at 5 to 15 s a turn and
# cuts only a fast endless loop; absent, factoryd takes 200. nudge_after:
# identical tool calls in a row (same tool, same input) that get the running
# session a message to change approach, nudges times per repetition; the
# next such run trips same_call to the supervisor (absent: 3 and 1).
# same_call: identical tool calls in one session, in a row or not, that
# trip the same_call detector after the nudges; above nudge_after (absent: 4).
limits:
  sessions: 3
  agent_time: 20m
  supervisor_calls: 3
  supervisor_timeout: 6m
  stronger_after: 1
  steps: 200
  nudge_after: 3
  nudges: 1
  same_call: 4

# Capability classes a task can hold (tasks.required_capabilities; intake
# gives agent tasks "coder"). models: the aliases the agent may call through
# the gateway. tools: the gateway's MCP tools the class may call, nothing
# else (ruling 132). A paid tool carries max_requests and max_eur per task
# (every admitted call counts; a call is held at its worst case below until
# its real cost is booked); a free tool is listed as {}: escalate_to_human
# and the commissioning tools, which spend through their reservation and
# the project envelope instead.
classes:
  coder:
    models: [coding-cheap, coding-frontier]
    # factoryd's calls on a coder task's account, through the gateway; the
    # agent cannot call these
    review_model: review-frontier
    supervisor_model: supervisor
    # the security audit on the stronger rung, as the screening's (rulings
    # 188, 191); the agent calls this alias too, on its own key
    audit_model: coding-frontier
    tools:
      web_scrape: {max_requests: 30, max_eur: 0.20}
      web_search: {max_requests: 30, max_eur: 0.20}
      replicate_predict: {max_requests: 5, max_eur: 0.50}
      fal_run: {max_requests: 5, max_eur: 0.50}
      escalate_to_human: {}
      request_info: {}
      cloud_prices: {}
      commission_server: {}
      list_resources: {}
      release_resource: {}
      ssh_certificate: {}
      resource_request_status: {}
  # a report session (ruling 185): the screening of an outsider's issue on
  # coding-frontier (ruling 191), the presort of an improvement; it reads
  # and writes one comment, changes no code and commissions nothing. Its
  # trips and half-way check-in call the supervisor model.
  analyzer:
    models: [coding-cheap, coding-frontier]
    supervisor_model: supervisor
    tools:
      web_scrape: {max_requests: 30, max_eur: 0.20}
      web_search: {max_requests: 30, max_eur: 0.20}
      request_info: {}
      escalate_to_human: {}

# Tool prices no provider API reports (USD prices booked 1:1 as EUR, as
# LiteLLM's are). fal's prices come from its pricing API per endpoint.
prices:
  firecrawl:
    # extra credits on the Hobby plan: 1,000 per 5 USD
    # https://www.firecrawl.dev/pricing (fetched 2026-09-28)
    eur_per_credit: 0.005
    # the worst case a call is held at: a scrape is 1 credit per page (basic
    # proxy, no PDF parser), a search 2 credits per 10 results (at most 10)
    scrape_credits: 1
    search_credits: 2
  replicate:
    # per second of predict_time, by hardware SKU
    # https://replicate.com/pricing (fetched 2026-09-28)
    eur_per_second:
      cpu: 0.0001
      gpu-t4: 0.000225
      gpu-l40s: 0.000975
      gpu-a100-large: 0.0014
      gpu-h100: 0.001525
    # Replicate's API names no model's hardware: a model is usable once it is
    # listed here with the SKU its model page names
    models:
      replicate/hello-world: cpu
    # a prediction is held at this many seconds of its hardware: the
    # gateway's 60 s wait, then a cancel
    max_seconds: 90
  fal:
    # an endpoint priced per megapixel is held at this many
    max_megapixels: 4

# Risk rules over a pull request's changed paths (a rename counts both its
# names). Each path takes the class of the first rule with a matching glob,
# else default; the pull request takes the most severe class among its paths.
# Globs are "/"-separated and anchored at the repository root: "**" matches
# any number of whole directories (none included), "*" and "?" match within
# one name (path.Match), so "k8s/**" is everything under k8s/ and
# "**/Dockerfile*" a Dockerfile at any depth. classes: most severe first.
# outcome: forbidden fails the task (its pull request is closed),
# requires_approval waits for a human's approval before factory-merge merges.
# There is no outcome without a human: the privileged main CI runs merged code
# (rulings 76, 77, 109).
# migration: true lists the class's paths on the approval card and the pull
# request as "schema migration: human review required".
risk:
  classes:
    - {name: forbidden, outcome: forbidden}
    - {name: migration, outcome: requires_approval, migration: true}
    - {name: high, outcome: requires_approval}
    - {name: normal, outcome: auto}
  rules:
    - {class: forbidden, paths: [".forgejo/**", ".gitea/**", ".github/**"]}
    - {class: migration, paths: ["**/migrations/**", "internal/policy/schema.sql"]}
    # the code repository's internal/policy/risk_test.go mirrors this block
    # (TestInfraRiskIsTheCopy compares them with INFRA_FACTORY_DIR set)
    # protected files: manifests and lockfiles of every common ecosystem,
    # agent instruction files and CODEOWNERS at any depth, and every
    # top-level dot directory or file (.forgejo, .gitea, .github stay
    # forbidden above)
    - class: high
      paths: ["k8s/**", "deploy/**", "**/Dockerfile*",
        "**/go.mod", "**/go.sum", "**/go.work", "**/go.work.sum",
        "**/package.json", "**/package-lock.json", "**/npm-shrinkwrap.json", "**/yarn.lock", "**/pnpm-lock.yaml",
        "**/Cargo.toml", "**/Cargo.lock",
        "**/bun.lock", "**/bun.lockb",
        "**/pyproject.toml", "**/requirements*.txt", "**/requirements/*.txt", "**/poetry.lock", "**/uv.lock", "**/Pipfile", "**/Pipfile.lock",
        "**/Gemfile", "**/Gemfile.lock", "**/pom.xml", "**/build.gradle*", "**/settings.gradle*", "**/gradle.lockfile",
        "**/*.csproj", "**/packages.lock.json", "**/Directory.Packages.props", "**/composer.json", "**/composer.lock",
        "**/AGENTS.md", "**/CLAUDE.md", "**/opencode.json", "**/opencode.jsonc", "**/CODEOWNERS",
        ".*/**"]
  default: normal

# The standard resource envelope (architecture 5.5): a project's first
# commissioning request copies it into the project's envelopes row, which
# the console edits. Per calendar month (UTC) in net EUR, reservations and
# accrued cost together; servers (with their primary IPv4) of these types,
# at most max_count at once, leases up to max_lease_hours, one volume per
# server up to volume_max_gb (0 = none, else at least 10). Beyond it, a
# request becomes a human approval card. No buckets (ruling 121): Hetzner's
# Cloud API has no Object Storage endpoint and its S3 keys reach every
# bucket of a project. A server's firewall admits SSH only from the cluster
# nodes and lets it out only on 53, 80 and 443, as build VMs (ruling 122).
envelope_default:
  monthly_eur: 10
  server_types: [cx23, cx33]
  max_count: 2
  max_lease_hours: 4
  volume_max_gb: 20

# Spend approvers (ruling 128): the Forgejo users who may authorize spend
# in the console: approve a resource request or a merge, promote a
# resource (an envelope is its project file's). Other writers of the code repository see the cards
# without those buttons and may still deny, request changes, reject and
# release. Forgejo's approvals whitelist on main stays the merge authority,
# so a merge approver must be on both.
approvers: [sebastian]

# Links in agent-written text factoryd posts on Forgejo (pull request body,
# issue and pull request comments) may point at these hosts and their
# subdomains; the Forgejo host and the project's environment hosts always
# may. Any other link is defanged (hxxps://evil[.]example), and mentions
# and closing keywords are neutralised either way.
link_hosts: [aisoftwarefactory.world]

# Activity bounds in seconds (ruling 140); the reproduction gate runs its
# command twice since ruling 167, so its bound is doubled.
bounds:
  GateReproduction: 1800
  # ruling 194: a review-frontier review of a 100-line diff took 210 s
  ModelReview: 360
  # the audit's one call on coding-frontier, the review's sibling
  GateAudit: 360
