cluster:
  etcd:
    listenSubnets:
      - 10.0.1.0/24
    advertisedSubnets:
      - 10.0.1.0/24
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # cpx42: nominal 320 GB disk reports about 300 GiB; match by size, not path
    match: disk.size > 100000000000u
  wipe: true
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: api-from-home
portSelector:
  ports:
    - 6443
    - 50000
  protocol: tcp
ingress:
  - subnet: HOME_CIDR
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: node-mesh-tcp
portSelector:
  ports:
    - 2379
    - 2380
    - 6443
    - 10250
    - 4240
    - 50000
    # Kubernetes NodePort range; pods reach the local node IP unmasqueraded,
    # so the pod subnet needs entry too, not just the node mesh
    - 30000-32767
  protocol: tcp
ingress:
  - subnet: 10.0.1.0/24
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: node-mesh-udp
portSelector:
  ports:
    - 8472
    - 6081
    # Cilium wireguard default; the 1.20 helm chart offers no listenPort override
    - 51871
  protocol: udp
ingress:
  - subnet: 10.0.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: web-from-world
portSelector:
  ports:
    - 80
    - 443
  protocol: tcp
ingress:
  - subnet: 0.0.0.0/0
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.size > 100000000000u
  # uncapped, EPHEMERAL grows to fill the whole disk; volumes grow only,
  # never shrink, so the user volume below could never provision. 200 GB:
  # the runner's dind volume, the factory caches, the images and the
  # sandbox pods outgrew 100 GB; the user volume held under 8 GB
  maxSize: 200GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
provisioning:
  diskSelector:
    match: disk.size > 100000000000u
  minSize: 100GB
  maxSize: 100GB
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  # EPHEMERAL holds the images too, so imagefs.available<15% is the
  # DiskPressure line; unused images go 10 points before it, not at it
  imageGCHighThresholdPercent: 75
  imageGCLowThresholdPercent: 65
  # ephemeral-storage keeps out of allocatable what lives on EPHEMERAL
  # outside any pod (the factory caches, the images in use, the system)
  # and the 5 % between the imagefs and nodefs thresholds
  systemReserved:
    cpu: 50m
    memory: 512Mi
    pid: "100"
    ephemeral-storage: 40Gi
---
# Every node pulls an outside image from the factory's store first
# (Forgejo's org upstream, the code repository's upstream-images.txt,
# roadmap 203): Talos's own images by tag, which the store's copy carries
# at the list's digest, Cilium's and the platform's by digest. A miss, or a
# store that is not up yet (a rebuild until Forgejo serves), falls back to
# the upstream. The store's login is RegistryAuthConfig
# git.aisoftwarefactory.world, applied after the seed by
# talos/registry-auth.sh, never in this file.
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/docker.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: ghcr.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/ghcr.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: quay.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/quay.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: registry.k8s.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/registry.k8s.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: code.forgejo.org
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/code.forgejo.org
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: factory.talos.dev
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/factory.talos.dev
    overridePath: true
---
machine:
  sysctls:
    user.max_user_namespaces: "11255"
