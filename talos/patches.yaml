cluster:
  etcd:
    listenSubnets:
      - 10.0.1.0/24
    advertisedSubnets:
      - 10.0.1.0/24
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # cpx42: nominal 320 GB disk reports about 300 GiB; match by size, not path
    match: disk.size > 100000000000u
  wipe: true
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: api-from-home
portSelector:
  ports:
    - 6443
    - 50000
  protocol: tcp
ingress:
  # home_cidr of terraform.tfvars, filled in by the generation step (README)
  - subnet: HOME_CIDR
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: node-mesh-tcp
portSelector:
  ports:
    - 2379
    - 2380
    - 6443
    - 10250
    - 4240
    - 50000
    # Kubernetes NodePort range; pods reach the local node IP unmasqueraded,
    # so the pod subnet needs entry too, not just the node mesh
    - 30000-32767
  protocol: tcp
ingress:
  - subnet: 10.0.1.0/24
  - subnet: 10.244.0.0/16
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: node-mesh-udp
portSelector:
  ports:
    - 8472
    - 6081
    # Cilium wireguard default; the 1.20 helm chart offers no listenPort override
    - 51871
  protocol: udp
ingress:
  - subnet: 10.0.1.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: web-from-world
portSelector:
  ports:
    - 80
    - 443
  protocol: tcp
ingress:
  - subnet: 0.0.0.0/0
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.size > 100000000000u
  # uncapped, EPHEMERAL grows to fill the whole disk; volumes grow only,
  # never shrink, so the user volume below could never provision. 200 GB:
  # the runner's dind volume, the factory caches, the images and the
  # sandbox pods outgrew 100 GB; the user volume held under 8 GB
  maxSize: 200GB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-path-provisioner
provisioning:
  diskSelector:
    match: disk.size > 100000000000u
  minSize: 100GB
  maxSize: 100GB
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  # EPHEMERAL holds the images too, so imagefs.available<15% is the
  # DiskPressure line; unused images go 10 points before it, not at it
  imageGCHighThresholdPercent: 75
  imageGCLowThresholdPercent: 65
  # ephemeral-storage: keeps out of allocatable what lives on EPHEMERAL
  # outside any pod (the factory caches, the images in use, the system)
  # and the 5 % between the imagefs and nodefs thresholds; sized for the
  # 200 GB EPHEMERAL above: a node still on a 100 GB one keeps Talos's
  # 256Mi, since 40Gi there leaves less than the CI runner's 50Gi request
  # memory: the pods' cgroup (kubepods) may use the node's memory less this,
  # and containerd, the kubelet and apid (the podruntime and system cgroups,
  # 1.9 GiB on average, 6.7 to 7.8 GiB at peak with cache) live in the
  # rest. At 512Mi pods filled the node and those cgroups stalled in reclaim,
  # which fired Talos's OOM controller; 2560Mi leaves them their average and
  # room.
  systemReserved:
    cpu: 50m
    memory: 2560Mi
    pid: "100"
    ephemeral-storage: 40Gi
---
# Every node pulls an outside image from the factory's store first
# (Forgejo's org upstream, the code repository's upstream-images.txt,
# roadmap 203): Talos's own images by tag, which the store's copy carries
# at the list's digest, Cilium's and the platform's by digest. A miss, or a
# store that is not up yet (a rebuild until Forgejo serves), falls back to
# the upstream. The store's login is RegistryAuthConfig
# git.aisoftwarefactory.world, applied after the seed by
# talos/registry-auth.sh, never in this file.
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: docker.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/docker.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: ghcr.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/ghcr.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: quay.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/quay.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: registry.k8s.io
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/registry.k8s.io
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: code.forgejo.org
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/code.forgejo.org
    overridePath: true
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: factory.talos.dev
endpoints:
  - url: https://git.aisoftwarefactory.world/v2/upstream/factory.talos.dev
    overridePath: true
---
machine:
  sysctls:
    user.max_user_namespaces: "11255"
---
# Talos 1.14's default trigger fires on pressure inside the System and
# Podruntime cgroups (their summed 10 s average above 5 %), which short
# memory stalls reach with 4 to 10 GiB of the node's memory still reclaimable
# (the 150 recorded triggers of 2026-11-09 to 11-18: the whole machine's
# full pressure was 0 at the kills of Forgejo and at most 14.5 % at any
# of them). The kernel's own OOM killer still guards each pod's limit; this
# controller exists to kill before the whole machine stalls, so it fires only
# on sustained full pressure of the whole machine. The ranking is the
# default's, and also gives a static pod (kube-apiserver, controller manager,
# scheduler: a 32-hex uid without dashes in the cgroup path, no limit
# possible from the cluster) the rank 0.0, which no kill reaches. A pod with
# a memory limit already ranks 0.0.
apiVersion: v1alpha1
kind: OOMConfig
triggerExpression: |
  memory_full_avg10 > 30.0 && memory_full_avg60 > 15.0 && time_since_trigger > duration("30s")
cgroupRankingExpression: |
  memory_max.hasValue() || path.matches("/pod[0-9a-f]{32}$") ? 0.0 :
  {Besteffort: 1.0, Burstable: 0.5, Guaranteed: 0.0, Podruntime: 0.0, System: 0.0}[class] *
  double(memory_current.orValue(0u))
---
# Each node's kernel log, Talos's own lines in it (the OOM controller's
# "Sending SIGKILL to cgroup"), as JSON lines to the otel-agent on the same
# node: 127.0.0.1:5170 is the agent's hostPort, which Cilium's kube-proxy
# replacement serves on the loopback (k8s/platform/k8s-infra). Talos retries
# a line every second until the agent takes it and keeps its place in the
# ring buffer meanwhile, so a boot before the agent runs loses nothing.
apiVersion: v1alpha1
kind: KmsgLogConfig
name: otel-agent
url: tcp://127.0.0.1:5170/
