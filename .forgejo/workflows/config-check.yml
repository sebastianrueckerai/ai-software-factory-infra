# factoryd's own check of the configuration tree factory/ (ruling 183) on
# every push to main: the decoder factoryd's loader runs, and the committed
# schema/ against the one the binary generates. The factoryd binary comes
# from the code repository's image tagged :main, the newest green main's,
# which the next roll deploys: red means that factoryd refuses (or will
# refuse) the commit, and the running one keeps its previous version.
name: config-check
on:
  push:
    branches: [main]
env:
  FACTORYD_IMAGE: git.aisoftwarefactory.world/sf/factory-gateway:main
jobs:
  config-check:
    # the org runner: this repository is human-only, so it runs only what
    # a human pushed to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LiteLLM's backstop sits behind the month cap
        run: scripts/budget-backstop-check
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: factoryd from main's newest image
        # the job's docker is the runner's dind, which cannot see the job's
        # files: the static binary is copied out instead of the tree in; the
        # pull takes the newest :main over a copy the runner kept
        run: |
          docker pull -q "$FACTORYD_IMAGE" >/dev/null
          id=$(docker create "$FACTORYD_IMAGE")
          docker cp "$id:/usr/local/bin/factoryd" ./factoryd
          docker rm "$id" >/dev/null
      - run: ./factoryd config check factory
