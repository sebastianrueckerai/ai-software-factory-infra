# Ingress of SigNoz's collector. Port 4319 feeds the pipelines that keep
# the namespace telemetry names, so only the k8s-infra collectors reach it;
# every other sender's OTLP (4317, 4318) and the other receivers feed the
# pipelines that set the namespace from the sending pod. The rest is the
# node (probes) and the collector's own metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: signoz-otel-collector, namespace: platform}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/instance: signoz, app.kubernetes.io/component: otel-collector}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: k8s-infra}
      toPorts:
        - ports: [{port: "4319", protocol: TCP}]
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - {port: "4317", protocol: TCP}
            - {port: "4318", protocol: TCP}
            - {port: "14250", protocol: TCP}
            - {port: "14268", protocol: TCP}
            - {port: "8081", protocol: TCP}
            - {port: "8082", protocol: TCP}
            - {port: "8888", protocol: TCP}
    - fromEntities: [host]
---
# Ingress of SigNoz's ClickHouse. Its native (9000), HTTP (8123) and
# interserver (9009) ports answer SigNoz's own components alone: the server,
# the collector, the schema migrator and the operator (which reads metrics and
# maintains the schema), and ClickHouse's replicas to each other. Any other
# pod, in any namespace, is denied; the node still probes it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: signoz-clickhouse, namespace: platform}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/instance: signoz, app.kubernetes.io/component: clickhouse}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/instance: signoz}
          matchExpressions:
            - {key: app.kubernetes.io/component, operator: In, values: [signoz, otel-collector, signoz-telemetrystore-migrator, operator, clickhouse]}
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
            - {port: "8123", protocol: TCP}
            - {port: "9009", protocol: TCP}
    - fromEntities: [host]
