apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: signoz, namespace: platform}
spec:
  interval: 10m
  releaseName: signoz
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The 2026-10-13 re-seed install took 4 m 53 s to
  # its last component (the collector, after ClickHouse and the schema
  # migration), past the default 5 minutes, and stalled.
  timeout: 15m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: platform
  chart:
    spec:
      chart: signoz
      version: 0.143.0
      sourceRef: {kind: HelmRepository, name: upstream, namespace: flux-system}
  # SigNoz creates its root user from these at boot, so self-registration is
  # closed before the public route serves; secret signoz-root is imperative.
  valuesFrom:
    - kind: Secret
      name: signoz-root
      valuesKey: email
      targetPath: signoz.env.signoz_user_root_email
    - kind: Secret
      name: signoz-root
      valuesKey: password
      targetPath: signoz.env.signoz_user_root_password
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    global:
      storageClass: local-path
      imagePullSecrets: [forgejo-registry]
    clickhouse:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: clickhouse/clickhouse-server, tag: "25.12.5@sha256:10f54f04de6c61b756c4eaf9f1d17464a4ac3e1f94b5b410e0dec92a24dbeda8"}
      # The histogramQuantile function's binary from the store, the one
      # layer its copy adds to alpine (the list's line pins the archive by
      # sha256), not downloaded from GitHub at each start.
      initContainers:
        udf:
          image: {registry: git.aisoftwarefactory.world/upstream, repository: files/histogram-quantile_linux_amd64.tar.gz, tag: "33997073eb6d@sha256:72b27cf84d625ae61559978fb66788856ac87656a389ff9fa01301b69cc3d3cb"}
          command: [cp, /histogram-quantile, /var/lib/clickhouse/user_scripts/histogramQuantile]
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
      resources:
        requests: {cpu: 250m, memory: 1Gi}
        limits: {cpu: "2", memory: 3Gi}
      # Hot data on the local-path volume, cold on bucket signoz-cold: the
      # signoz-objects CronJob sets the TTLs that move parts to volume s3.
      # The key pair comes from secret signoz-s3 through include_from, so it
      # is in no ConfigMap and no custom resource, and hide_in_preprocessed
      # keeps it out of preprocessed_configs on the data volume. move_factor
      # moves the oldest parts to S3 once the local volume is 90 % full.
      files:
        config.d/storage.xml: |
          <clickhouse>
            <include_from>/etc/clickhouse-server/secrets/s3.xml</include_from>
            <storage_configuration>
              <disks>
                <s3>
                  <type>s3</type>
                  <endpoint>https://fsn1.your-objectstorage.com/signoz-cold/data/</endpoint>
                  <access_key_id incl="signoz_s3_access_key_id" hide_in_preprocessed="true"/>
                  <secret_access_key incl="signoz_s3_secret_access_key" hide_in_preprocessed="true"/>
                  <skip_access_check>true</skip_access_check>
                </s3>
              </disks>
              <policies>
                <tiered>
                  <volumes>
                    <default>
                      <disk>default</disk>
                    </default>
                    <s3>
                      <disk>s3</disk>
                      <perform_ttl_move_on_insert>0</perform_ttl_move_on_insert>
                      <prefer_not_to_merge>1</prefer_not_to_merge>
                    </s3>
                  </volumes>
                  <move_factor>0.1</move_factor>
                </tiered>
              </policies>
            </storage_configuration>
          </clickhouse>
      additionalVolumes:
        - name: signoz-s3
          secret: {secretName: signoz-s3}
      additionalVolumeMounts:
        - {name: signoz-s3, mountPath: /etc/clickhouse-server/secrets, readOnly: true}
      clickhouseOperator:
        image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: altinity/clickhouse-operator, tag: "0.21.2@sha256:f972ef4aec9959313a4d4407a83803c75f0be215af4a6811b3f2b890c15ba893"}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        metricsExporter:
          image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: altinity/metrics-exporter, tag: "0.21.2@sha256:084a75d8ab0ba5c31ed9d923d301745d24f0e8a3cadf54cdbfe298443eda8da9"}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      zookeeper:
        enabled: true
        image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: signoz/zookeeper, tag: "3.7.1@sha256:1e6c92e8656c299818acfaf72f11e59d68a92bfe39fc1b1137cd78d6ab6741aa"}
        # One ClickHouse replica keeps a few MB in ZooKeeper; the chart's
        # 1024 MB heap only reserved memory.
        heapSize: 256
        resources:
          requests: {cpu: 50m, memory: 384Mi}
          limits: {cpu: 500m, memory: 640Mi}
    signoz:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: signoz/signoz, tag: "v0.143.0@sha256:c0ffe2e61d8152f87be0637b5e66d775fe155920ffe80f0a2422f48d9c1c1bf6"}
      replicaCount: 1
      env:
        signoz_user_root_enabled: "true"
        signoz_user_root_org__name: aisoftwarefactory
        # the alert rules' links (ruleSource, the webhook's generatorURL)
        # name this base; the chart's default is http://localhost:8080
        signoz_alertmanager_signoz_external__url: https://signoz.aisoftwarefactory.world
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: "1", memory: 768Mi}
    otelCollector:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: signoz/signoz-otel-collector, tag: "v0.144.11@sha256:c9fe68529e7a035dac786cb755d901049d475347567e3080fa87e8092369fa48"}
      replicaCount: 1
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
      # OTLP from the k8s-infra collectors alone (policy.yaml): their
      # telemetry names the namespace of what it measures, so it keeps it.
      ports:
        otlp-k8s-infra: {enabled: true, containerPort: 4319, servicePort: 4319, nodePort: "", protocol: TCP}
      config:
        receivers:
          otlp/k8s-infra:
            protocols:
              http: {endpoint: 0.0.0.0:4319}
        processors:
          # An app's own telemetry may name any namespace, and a project's
          # rules and factoryd's alert routing read k8s.namespace.name: the
          # names an app sends go, and k8sattributes sets the namespace of
          # the pod the connection comes from. It keeps a value it finds,
          # so the deletion runs first.
          resource/namespace:
            attributes:
              - {key: k8s.namespace.name, action: delete}
              - {key: k8s_namespace_name, action: delete}
          attributes/namespace:
            actions:
              - {key: k8s.namespace.name, action: delete}
              - {key: k8s_namespace_name, action: delete}
          # The receivers open only once the pods and namespaces are read,
          # so no telemetry passes unnamed after a restart. A wait that
          # times out does not end this build: it stays in its start, its
          # health check at 503, until the liveness probe restarts it after
          # about 65 s; 60 s lets an API server back within that minute
          # still start it.
          k8sattributes/namespace:
            passthrough: false
            wait_for_metadata: true
            wait_for_metadata_timeout: 60s
            pod_association:
              - sources: [{from: connection}]
            extract:
              metadata: [k8s.namespace.name]
        service:
          pipelines:
            traces:
              processors: [resource/namespace, attributes/namespace, k8sattributes/namespace, signozspanmetrics/delta, signozspanmapper, signozllmpricing, batch]
            metrics:
              processors: [resource/namespace, attributes/namespace, k8sattributes/namespace, batch]
            logs:
              processors: [resource/namespace, attributes/namespace, k8sattributes/namespace, batch]
            metrics/k8s-infra:
              receivers: [otlp/k8s-infra]
              processors: [batch]
              exporters: [metadataexporter, signozclickhousemetrics, signozmeter]
            logs/k8s-infra:
              receivers: [otlp/k8s-infra]
              processors: [batch]
              exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
    telemetryStoreMigrator:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
