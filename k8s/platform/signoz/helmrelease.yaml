apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: signoz, namespace: flux-system}
spec: {interval: 10m, url: https://charts.signoz.io}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: signoz, namespace: platform}
spec:
  interval: 10m
  releaseName: signoz
  targetNamespace: platform
  chart:
    spec:
      chart: signoz
      version: 0.143.0
      sourceRef: {kind: HelmRepository, name: signoz, namespace: flux-system}
  values:
    global:
      storageClass: local-path
    clickhouse:
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
      zookeeper:
        enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
    signoz:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    otelCollector:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    telemetryStoreMigrator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
