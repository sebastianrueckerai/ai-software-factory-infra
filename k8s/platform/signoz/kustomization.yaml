apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helmrelease.yaml
- objects.yaml
configMapGenerator:
- name: signoz-objects-script
  namespace: platform
  files: [objects.sh]
- name: signoz-dashboards
  namespace: platform
  files: [dashboards/factory-pipeline.json]
- name: signoz-alerts
  namespace: platform
  files: [alerts/job-failed-pod.json]
