apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helmrelease.yaml
- objects.yaml
- policy.yaml
configMapGenerator:
- name: signoz-objects-script
  namespace: platform
  files: [objects.sh]
- name: signoz-dashboards
  namespace: platform
  files: [dashboards/factory-pipeline.json]
# Node disk and Local-path volume read a node's filesystems, and Chain
# poller stopped reads factoryd's own gauge, which no namespace holds and
# so no bound rule can: platform rules whose label
# namespace platform routes them to factoryd, which files a human-lane
# issue on this repository.
- name: signoz-alerts
  namespace: platform
  files: [alerts/job-failed.json, alerts/node-disk.json, alerts/local-path-disk.json, alerts/chain-poll-age.json]
# The platform's rules as the infra repository's project rules (rulings
# 159, 180): signoz-objects binds each to its ConfigMap's namespace and
# routes it to factoryd, which files a human-lane issue on this repository.
# Job failed is the platform rule above, bound here to each namespace.
- name: signoz-rules
  namespace: platform
  files: [project-rules/cnpg-not-ready.json, alerts/job-failed.json]
  options:
    disableNameSuffixHash: true
    labels: {factory/signoz-rules: "true"}
- name: signoz-rules
  namespace: forgejo
  files: [project-rules/forgejo-5xx.json, alerts/job-failed.json]
  options:
    disableNameSuffixHash: true
    labels: {factory/signoz-rules: "true"}
