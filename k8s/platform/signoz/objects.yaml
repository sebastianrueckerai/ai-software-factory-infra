# Writes factoryd's viewer account, the webhook channel factoryd, the
# dashboards (dashboards/*.json), the alert rules (alerts/*.json and every
# project's ConfigMaps labelled factory/signoz-rules=true) and the retention
# (HOT_DAYS on the local volume, then S3, deleted after RETENTION_DAYS) into
# SigNoz, which loses all of it with its volumes on a rebuild. Edits made in
# the UI to the platform's objects are overwritten on the next run: change
# the files or the values here.
apiVersion: v1
kind: ServiceAccount
metadata: {name: signoz-objects, namespace: platform}
---
# the project namespaces and their rule ConfigMaps; RBAC cannot select by
# label, so list reaches every ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: signoz-objects}
rules:
- apiGroups: [""]
  resources: [namespaces, configmaps]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: signoz-objects}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: signoz-objects}
subjects:
- {kind: ServiceAccount, name: signoz-objects, namespace: platform}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: signoz-objects, namespace: platform}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: signoz-objects
          restartPolicy: Never
          containers:
            - name: objects
              image: alpine/k8s:1.36.1@sha256:692239d739589247c4a791205ed9619c28ae85a21286e19a6211c04a62c56668
              command: [sh, /scripts/objects.sh]
              env:
                - name: SIGNOZ_EMAIL
                  valueFrom: {secretKeyRef: {name: signoz-root, key: email}}
                - name: SIGNOZ_PASSWORD
                  valueFrom: {secretKeyRef: {name: signoz-root, key: password}}
                - name: VIEWER_EMAIL
                  valueFrom: {secretKeyRef: {name: signoz-factoryd, key: email}}
                - name: VIEWER_PASSWORD
                  valueFrom: {secretKeyRef: {name: signoz-factoryd, key: password}}
                - name: SIGNOZ_WEBHOOK_PASSWORD
                  valueFrom: {secretKeyRef: {name: signoz-webhook, key: password}}
                - {name: HOT_DAYS, value: "7"}
                - {name: RETENTION_DAYS, value: "30"}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: dashboards, mountPath: /dashboards, readOnly: true}
                - {name: alerts, mountPath: /alerts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: signoz-objects-script}
            - name: dashboards
              configMap: {name: signoz-dashboards}
            - name: alerts
              configMap: {name: signoz-alerts}
            - name: tmp
              emptyDir: {}
