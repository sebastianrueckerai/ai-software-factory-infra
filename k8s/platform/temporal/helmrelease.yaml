apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: temporalio, namespace: flux-system}
spec: {interval: 10m, url: https://go.temporal.io/helm-charts}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: temporal, namespace: platform}
spec:
  interval: 10m
  releaseName: temporal
  targetNamespace: platform
  chart:
    spec:
      chart: temporal
      version: 1.7.0
      sourceRef: {kind: HelmRepository, name: temporalio, namespace: flux-system}
  values:
    server:
      config:
        persistence:
          defaultStore: default
          visibilityStore: visibility
          numHistoryShards: 512
          datastores:
            default:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal
                connectAddr: sf-cluster-rw.platform.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: pg-temporal
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal_visibility
                connectAddr: sf-cluster-rw.platform.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: pg-temporal
                secretKey: password
                createDatabase: false
                manageSchema: true
        namespaces:
          create: true
          useHelmHooks: false
          namespace:
            - name: default
              retention: 3d
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    schema:
      useHelmHooks: false
      resources:
        requests: {cpu: 100m, memory: 128Mi}
    web:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
    admintools:
      resources:
        requests: {cpu: 50m, memory: 128Mi}
