apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: temporalio, namespace: flux-system}
spec: {interval: 10m, url: https://go.temporal.io/helm-charts}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: temporal, namespace: platform}
spec:
  interval: 10m
  releaseName: temporal
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The schema jobs set up and migrate both
  # databases before the services start.
  timeout: 10m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: platform
  chart:
    spec:
      chart: temporal
      version: 1.7.0
      sourceRef: {kind: HelmRepository, name: temporalio, namespace: flux-system}
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    imagePullSecrets: [{name: forgejo-registry}]
    server:
      image:
        repository: git.aisoftwarefactory.world/upstream/docker.io/temporalio/server
        tag: "1.32.0@sha256:ca47d4de249b9cc28137628dba77ae5e75e8b313ebb5c801c64615c1c99cbb09"
      config:
        persistence:
          defaultStore: default
          visibilityStore: visibility
          numHistoryShards: 512
          datastores:
            default:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal
                connectAddr: sf-cluster-rw.platform.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: pg-temporal
                secretKey: password
                createDatabase: false
                manageSchema: true
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12
                driverName: postgres12
                databaseName: temporal_visibility
                connectAddr: sf-cluster-rw.platform.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: pg-temporal
                secretKey: password
                createDatabase: false
                manageSchema: true
        namespaces:
          create: true
          useHelmHooks: false
          namespace:
            - name: default
              retention: 3d
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
    schema:
      useHelmHooks: false
      resources:
        requests: {cpu: 100m, memory: 128Mi}
    web:
      image:
        repository: git.aisoftwarefactory.world/upstream/docker.io/temporalio/ui
        tag: "2.54.1@sha256:1f950ff598c810f371c60f1bf16de742caa6b8f60e0cdba05526a434e09b6d43"
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
    admintools:
      image:
        repository: git.aisoftwarefactory.world/upstream/docker.io/temporalio/admin-tools
        tag: "1.32.0@sha256:8bb84e24db4336de48031a66dbda25a7477d300736fe825893e467042135da1f"
      resources:
        requests: {cpu: 50m, memory: 128Mi}
