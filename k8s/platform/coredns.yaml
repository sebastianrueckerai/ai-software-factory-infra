apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        rewrite stop {
            name exact git.aisoftwarefactory.world cilium-gateway-edge-gateway.forgejo.svc.cluster.local
        }
        rewrite stop {
            name exact console.aisoftwarefactory.world cilium-gateway-edge-gateway.forgejo.svc.cluster.local
        }
        rewrite stop {
            name exact signoz.aisoftwarefactory.world cilium-gateway-edge-gateway.forgejo.svc.cluster.local
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
