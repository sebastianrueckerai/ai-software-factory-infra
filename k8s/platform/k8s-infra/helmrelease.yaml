# Node and pod telemetry into SigNoz: the otel-agent DaemonSet (host
# metrics, kubelet stats, container logs) and the otel-deployment (cluster
# metrics and Kubernetes events). Its own namespace because the agent needs
# hostPath mounts, which the cluster's baseline Pod Security forbids in
# platform. Log files never read: the agent sandboxes (factory-agents-*,
# an agent's transcript), the trusted runner (it echoes every job step's
# output, already kept in Forgejo), SigNoz and these collectors themselves
# (every insert would log lines that are inserted next).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: k8s-infra, namespace: platform}
spec:
  interval: 10m
  releaseName: k8s-infra
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The agent DaemonSet on three nodes was ready 15
  # s after the 2026-10-13 re-seed install.
  timeout: 5m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: k8s-infra
  chart:
    spec:
      chart: k8s-infra
      version: 0.17.1
      sourceRef: {kind: HelmRepository, name: upstream, namespace: flux-system}
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    global:
      clusterName: sf
      imagePullSecrets: [forgejo-registry]
    otelCollectorEndpoint: http://signoz-otel-collector.platform.svc.cluster.local:4318
    presets:
      logsCollection:
        blacklist:
          signozLogs: false
          namespaces: [factory-agents-*, k8s-infra]
          pods: [forgejo-runner]
          additionalExclude:
            - /var/log/pods/platform_signoz-0_*/*/*.log
            - /var/log/pods/platform_signoz-otel-collector-*/*/*.log
            - /var/log/pods/platform_signoz-zookeeper-*/*/*.log
            - /var/log/pods/platform_signoz-clickhouse-operator-*/*/*.log
            - /var/log/pods/platform_signoz-telemetrystore-migrator-*/*/*.log
            - /var/log/pods/platform_chi-signoz-clickhouse-*/*/*.log
      # Host CPU, memory, load and disk I/O come from /proc, which reports
      # the host's values without the host's root filesystem mounted;
      # kubeletstats covers node network and filesystem.
      hostMetrics:
        rootPath: ""
        scrapers: {network: null, filesystem: null}
    otelAgent:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: otel/opentelemetry-collector-contrib, tag: "0.139.0@sha256:87b591b18a0a330b6246f6d4f53d4867d1b238d1b85a69145e0f4eb38f92154c"}
      clusterRole:
        rules:
          - apiGroups: [""]
            resources: [pods, namespaces, nodes, persistentvolumes, persistentvolumeclaims]
            verbs: [get, list, watch]
          - apiGroups: [apps]
            resources: [replicasets]
            verbs: [get, list, watch]
          - apiGroups: [batch]
            resources: [jobs]
            verbs: [list, watch]
          - apiGroups: [""]
            resources: [nodes/stats, nodes/pods]
            verbs: [get]
      # Container log files are root-owned 0640; reading them needs uid 0,
      # no capability.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      # The agent receives nothing: no OTLP receiver, no host port.
      ports:
        otlp: {enabled: false, hostPort: null}
        otlp-http: {enabled: false, hostPort: null}
        metrics: {enabled: false, hostPort: null}
        health-check: {hostPort: null}
      # The chart adds a SigNoz Cloud access-token header from an unset
      # SIGNOZ_API_KEY; the self-hosted collector takes none.
      config:
        receivers: {otlp: null}
        exporters: {otlphttp: {headers: null}}
        service:
          pipelines:
            traces: {receivers: []}
            metrics: {receivers: []}
            logs: {receivers: []}
      additionalEnvs:
        GOMEMLIMIT: 320MiB
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 384Mi}
    otelDeployment:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: otel/opentelemetry-collector-contrib, tag: "0.139.0@sha256:87b591b18a0a330b6246f6d4f53d4867d1b238d1b85a69145e0f4eb38f92154c"}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
      config:
        exporters: {otlphttp: {headers: null}}
      additionalEnvs:
        GOMEMLIMIT: 200MiB
      resources:
        requests: {cpu: 25m, memory: 96Mi}
        limits: {cpu: 250m, memory: 256Mi}
