apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: litellm, namespace: flux-system}
spec:
  interval: 10m
  url: oci://ghcr.io/berriai/litellm-helm
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=1.102.1 <1.103.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: litellm, namespace: platform}
spec:
  interval: 10m
  releaseName: litellm
  targetNamespace: platform
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: flux-system
  values:
    replicaCount: 1
    masterkeySecretName: litellm-master-key
    db:
      deployStandalone: false
      useExisting: true
      endpoint: sf-cluster-rw.platform.svc
      database: litellm
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
      secret:
        name: pg-litellm
        usernameKey: username
        passwordKey: password
    proxyConfigMap:
      create: true
    proxy_config:
      model_list:
        - model_name: deepseek-chat
          litellm_params:
            model: deepseek/deepseek-chat
            api_key: os.environ/DEEPSEEK_API_KEY
        # Model tiers (rulings 181, 192): every deployment measured by
        # scripts/model-tiers on 2026-09-29 (task-77-report.md). tier-high is
        # each provider's strongest general coding model, no preview or small
        # model, equal weights; tier-mid and tier-low weight by measured rank
        # (all passed 9 of 9 samples, so rank is p50 latency).
        # The role aliases map onto tiers in router_settings.model_group_alias.
        - model_name: tier-high
          litellm_params:
            model: dashscope/qwen3.8-max
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
            weight: 1
        - model_name: tier-high
          litellm_params:
            model: deepseek/deepseek-v4-pro
            api_key: os.environ/DEEPSEEK_API_KEY
            drop_params: true
            weight: 1
        - model_name: tier-high
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
            weight: 1
        - model_name: tier-mid
          litellm_params:
            model: groq/openai/gpt-oss-120b
            api_key: os.environ/GROQ_KEY
            drop_params: true
            weight: 4
        - model_name: tier-mid
          litellm_params:
            model: dashscope/qwen3.7-plus
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
            weight: 3
        - model_name: tier-mid
          litellm_params:
            model: zai/glm-5
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
            weight: 2
        - model_name: tier-mid
          litellm_params:
            model: zai/glm-4.7
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
            weight: 1
        - model_name: tier-low
          litellm_params:
            model: groq/openai/gpt-oss-20b
            api_key: os.environ/GROQ_KEY
            drop_params: true
            weight: 4
        - model_name: tier-low
          litellm_params:
            model: deepseek/deepseek-flash
            api_key: os.environ/DEEPSEEK_API_KEY
            drop_params: true
            weight: 3
        - model_name: tier-low
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
            weight: 2
        - model_name: tier-low
          litellm_params:
            model: zai/glm-5.3-flash
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
            weight: 1
      router_settings:
        # weighted random pick: every provider of a tier keeps getting calls,
        # so the audit's deployment column can compare them (latency-based
        # routing would starve all but the fastest, usage-based needs TPM
        # limits the providers do not publish)
        routing_strategy: simple-shuffle
        # a failed call re-picks by weight among the tier's healthy others:
        # the fallback in ranked order, never into another tier (ruling 189)
        enable_weighted_failover: true
        num_retries: 0
        # one failure puts a deployment into a minute's cooldown
        allowed_fails: 1
        cooldown_time: 60
        # /model/info lists each alias once per deployment of its tier, so
        # the gateway's price book holds at the tier's dearest deployment
        model_group_alias:
          supervisor: tier-high
          review-frontier: tier-high
          coding-frontier: tier-high
          coding-cheap: tier-low
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        # backstop behind factory-gateway's holds: refuse a call whose
        # worst case does not fit the key's max_budget instead of shrinking
        # the reservation and admitting it
        fail_closed_budget_enforcement: true
      litellm_settings:
        # factory-gateway books a stream's cost from its final usage chunk
        include_cost_in_streaming_usage: true
    environmentSecrets:
      - litellm-deepseek
      - litellm-qwen
      - litellm-glm
      - litellm-groq
    migrationJob:
      enabled: true
      hooks:
        argocd:
          enabled: false
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
