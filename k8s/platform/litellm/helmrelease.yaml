apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: litellm, namespace: flux-system}
spec:
  interval: 10m
  # the chart from the factory's store by its digest (the code
  # repository's upstream-images.txt, roadmap 203)
  url: oci://git.aisoftwarefactory.world/upstream/ghcr.io/berriai/litellm-helm
  ref: {digest: "sha256:4fe3ffcf630497e72a55429ef27134516bc3a2bacfe8c51ee23a9a42c071ea5f"}
  secretRef: {name: forgejo-registry}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: litellm, namespace: platform}
spec:
  interval: 10m
  releaseName: litellm
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The migrations job runs LiteLLM's schema
  # migrations before the proxy starts.
  timeout: 10m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: platform
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: flux-system
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    image:
      repository: git.aisoftwarefactory.world/upstream/ghcr.io/berriai/litellm
      tag: "1.102.4@sha256:76ea408529343acce6a359f31fa4fe910e9fdda82d0c9fc1b0441ccf9cef0ec3"
    imagePullSecrets: [{name: forgejo-registry}]
    replicaCount: 1
    masterkeySecretName: litellm-master-key
    db:
      deployStandalone: false
      useExisting: true
      endpoint: sf-cluster-rw.platform.svc
      database: litellm
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
      secret:
        name: pg-litellm
        usernameKey: username
        passwordKey: password
    proxyConfigMap:
      create: true
    proxy_config:
      model_list:
        # Model tiers (rulings 181, 204): Alibaba, one deployment per tier,
        # each measured by scripts/model-tiers. The role aliases map onto
        # tiers in router_settings.model_group_alias. The GLM Coding Plan
        # trial (roadmap 207, 2026-10-13) adds the two glm deployments: the
        # coding aliases point at them, every other alias stays on DashScope
        # (item 197's latency: a 100-line review took 210 s on GLM).
        - model_name: tier-high
          litellm_params:
            model: dashscope/qwen3.8-max
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
        - model_name: tier-mid
          litellm_params:
            model: dashscope/qwen3.7-plus
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: tier-low
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        # The GLM Coding Plan trial (roadmap 207): Sebastian's subscription
        # endpoint for both coding tiers. LiteLLM prices them at
        # pay-as-you-go rates (modeled money, roadmap 206; the bundled map
        # carries both models since 1.102). No enable_thinking: Qwen's extra.
        - model_name: glm-frontier
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/coding/paas/v4
            api_key: os.environ/ZAI_CODING_KEY
            drop_params: true
        - model_name: glm-cheap
          litellm_params:
            model: zai/glm-5.3-flash
            api_base: https://api.z.ai/api/coding/paas/v4
            api_key: os.environ/ZAI_CODING_KEY
            drop_params: true
      router_settings:
        # a call failing with 408, 409, 429 or 5xx is retried twice on the
        # same deployment after 0.5 s, then 1 s (or the provider's
        # Retry-After up to 60 s); other 4xx fail at once
        num_retries: 2
        # a tier has no second deployment to fail over to, so a cooldown
        # would only lock the whole tier after a failure
        disable_cooldowns: true
        model_group_alias:
          supervisor: tier-high
          review-frontier: tier-high
          # a GLM window (Sebastian's plan, 2026-10-14): both coding
          # aliases on his GLM Coding Plan while its quota lasts, then back
          # to DashScope (tier-high, tier-low). Opened 2026-10-15, his limit
          # reset; the first window ran 2026-10-13/14
          coding-frontier: glm-frontier
          coding-cheap: glm-cheap
          # Stage 15 (ruling 252): the project agent and the pulse
          operator: tier-high
          pulse: tier-low
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        # a budget that is set stays a hard ceiling: a call whose spend
        # neither Redis nor the database can confirm is refused (503), not
        # admitted. factory-gateway mints its task keys without max_budget
        # (its holds are the per-task budget), so the budget left here is
        # the proxy-wide max_budget below (user litellm-proxy-budget).
        fail_closed_budget_enforcement: true
      litellm_settings:
        # factory-gateway books a stream's cost from its final usage chunk
        include_cost_in_streaming_usage: true
        # proxy-wide stop behind the gateway's accounting (queue item 64 b):
        # every call is refused once the month's spend passes it (USD; 1mo
        # resets on the 1st, 00:00 UTC); the spend sits in user row
        # litellm-proxy-budget. A backstop only: 1.25 x the policy's
        # budget.month_eur, so the gateway's month cap stops first
        # (scripts/budget-backstop-check, run by config-check).
        max_budget: 680
        budget_duration: 1mo
    environmentSecrets:
      - litellm-qwen
      - litellm-zai
    migrationJob:
      enabled: true
      hooks:
        argocd:
          enabled: false
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
