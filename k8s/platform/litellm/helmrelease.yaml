apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: litellm, namespace: flux-system}
spec:
  interval: 10m
  url: oci://ghcr.io/berriai/litellm-helm
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=1.102.1 <1.103.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: litellm, namespace: platform}
spec:
  interval: 10m
  releaseName: litellm
  targetNamespace: platform
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: flux-system
  values:
    replicaCount: 1
    masterkeySecretName: litellm-master-key
    db:
      deployStandalone: false
      useExisting: true
      endpoint: sf-cluster-rw.platform.svc
      database: litellm
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
      secret:
        name: pg-litellm
        usernameKey: username
        passwordKey: password
    proxyConfigMap:
      create: true
    proxy_config:
      model_list:
        # Model tiers (rulings 181, 204): one provider, Alibaba, one deployment
        # per tier, each measured by scripts/model-tiers. The role aliases map
        # onto tiers in router_settings.model_group_alias.
        - model_name: tier-high
          litellm_params:
            model: dashscope/qwen3.8-max
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
        - model_name: tier-mid
          litellm_params:
            model: dashscope/qwen3.7-plus
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: tier-low
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
      router_settings:
        # a call failing with 408, 409, 429 or 5xx is retried twice on the
        # same deployment after 0.5 s, then 1 s (or the provider's
        # Retry-After up to 60 s); other 4xx fail at once
        num_retries: 2
        # a tier has no second deployment to fail over to, so a cooldown
        # would only lock the whole tier after a failure
        disable_cooldowns: true
        model_group_alias:
          supervisor: tier-high
          review-frontier: tier-high
          coding-frontier: tier-high
          coding-cheap: tier-low
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        # backstop behind factory-gateway's holds: refuse a call whose
        # worst case does not fit the key's max_budget instead of shrinking
        # the reservation and admitting it
        fail_closed_budget_enforcement: true
      litellm_settings:
        # factory-gateway books a stream's cost from its final usage chunk
        include_cost_in_streaming_usage: true
        # proxy-wide stop behind the gateway's accounting (queue item 64 b):
        # every call is refused once the month's spend passes it (USD, about
        # the 80 EUR cap of the Stage 15 round, 55 for the 50 EUR cap before
        # and after); 1mo resets on the 1st, 00:00 UTC; the spend sits
        # in user row litellm-proxy-budget
        max_budget: 88
        budget_duration: 1mo
    environmentSecrets:
      - litellm-qwen
    migrationJob:
      enabled: true
      hooks:
        argocd:
          enabled: false
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
