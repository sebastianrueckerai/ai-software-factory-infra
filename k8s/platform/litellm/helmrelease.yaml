apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: litellm, namespace: flux-system}
spec:
  interval: 10m
  # the chart from the factory's store by its digest (the code
  # repository's upstream-images.txt, roadmap 203)
  url: oci://git.aisoftwarefactory.world/upstream/ghcr.io/berriai/litellm-helm
  ref: {digest: "sha256:4fe3ffcf630497e72a55429ef27134516bc3a2bacfe8c51ee23a9a42c071ea5f"}
  secretRef: {name: forgejo-registry}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: litellm, namespace: platform}
spec:
  interval: 10m
  releaseName: litellm
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The migrations job runs LiteLLM's schema
  # migrations before the proxy starts.
  timeout: 10m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: platform
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: flux-system
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    image:
      repository: git.aisoftwarefactory.world/upstream/ghcr.io/berriai/litellm
      tag: "1.102.4@sha256:76ea408529343acce6a359f31fa4fe910e9fdda82d0c9fc1b0441ccf9cef0ec3"
    imagePullSecrets: [{name: forgejo-registry}]
    replicaCount: 1
    masterkeySecretName: litellm-master-key
    db:
      deployStandalone: false
      useExisting: true
      endpoint: sf-cluster-rw.platform.svc
      database: litellm
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
      secret:
        name: pg-litellm
        usernameKey: username
        passwordKey: password
    proxyConfigMap:
      create: true
    proxy_config:
      model_list:
        # Two model classes (Sebastian, 2026-10-20): big and small, each a
        # z.ai model and an Alibaba model. A call names its class; the
        # class's group is its z.ai model, and router_settings.fallbacks
        # moves a call the z.ai model failed or refused to the Alibaba
        # group. One alias per class: a call's purpose sits on its audit
        # row and in its ledger ref, not in its alias.
        - model_name: big
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/coding/paas/v4
            api_key: os.environ/ZAI_CODING_KEY
            drop_params: true
        - model_name: big-alibaba
          litellm_params:
            model: dashscope/qwen3.8-max
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # thinking is not bounded by max_tokens (verified on Qwen: max_tokens
            # 60 gave 240 completion tokens), so the gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
        - model_name: small
          litellm_params:
            model: zai/glm-5.3-flash
            api_base: https://api.z.ai/api/coding/paas/v4
            api_key: os.environ/ZAI_CODING_KEY
            drop_params: true
        - model_name: small-alibaba
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        # The premium class (rulings 328, 329; Sebastian, 2026-10-29): a
        # pay-per-token model for the planner, the chat and the review, its
        # spend capped apart by policy.yaml's budget.premium_month_eur. A
        # development stopgap: removing it is this entry, its fallback line,
        # the litellm-openai secret and the policy's premium keys. Every call
        # goes through OpenAI's Responses API (openai/responses/): the chat
        # completions API refuses reasoning_effort max for gpt-6.1-sol
        # (low to xhigh only, verified 2026-10-29). LiteLLM merges no price
        # entry for that route, so model_info pins Sol's rates for the
        # gateway's price book (developers.openai.com/api/docs/pricing, read
        # 2026-10-29 through LiteLLM's entry): base and above 272k prompt
        # tokens, cache writes at 1.25 times the input rate. LiteLLM bills
        # from its own entry. The OpenAI project stays on the default service
        # tier and this entry sets no data_residency: the price book counts
        # neither tier rates nor the regional uplift.
        - model_name: premium
          litellm_params:
            model: openai/responses/gpt-6.1-sol
            api_key: os.environ/OPENAI_API_KEY
            drop_params: true
            reasoning_effort: max
          model_info:
            input_cost_per_token: 0.000002
            input_cost_per_token_above_272k_tokens: 0.000004
            cache_creation_input_token_cost: 0.0000025
            cache_creation_input_token_cost_above_272k_tokens: 0.000005
            cache_read_input_token_cost: 0.0000001
            cache_read_input_token_cost_above_272k_tokens: 0.0000002
            output_cost_per_token: 0.00001
            output_cost_per_token_above_272k_tokens: 0.000015
            max_output_tokens: 128000
        # The chat's vision door (roadmap 300's images, 2026-10-19): the
        # look at a member's image, a tool on the metrics page, not a text
        # class. Thinking off as on the Alibaba text models: it is not
        # bounded by max_tokens, so the gateway's output clamp would not hold.
        - model_name: vision
          litellm_params:
            model: dashscope/qwen3-vl-plus
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            # Costs pinned to Model Studio's intl rate card (read 2026-10-19):
            # $0.20 in / $1.60 out per 1M tokens, the up-to-32K tier the door
            # always sits in (one image, an ask under 2000 chars). Pinned so
            # the spend reads even if LiteLLM's bundled map lacks the model.
            input_cost_per_token: 0.0000002
            output_cost_per_token: 0.0000016
            extra_body:
              enable_thinking: false
      router_settings:
        # a call failing with 408, 409, 429 or 5xx is retried twice on the
        # same deployment after 0.5 s, then 1 s (or the provider's
        # Retry-After up to 60 s); other 4xx fail at once. Then the class's
        # Alibaba group answers the call; premium's falls to big, then big's
        # Alibaba group, never below big (ruling 329)
        num_retries: 2
        fallbacks:
          - big: [big-alibaba]
          - small: [small-alibaba]
          - premium: [big, big-alibaba]
        # a z.ai model that failed allowed_fails calls within a minute rests
        # cooldown_time seconds, and the Alibaba group serves its class
        # meanwhile
        allowed_fails: 3
        cooldown_time: 60
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        # a budget that is set stays a hard ceiling: a call whose spend
        # neither Redis nor the database can confirm is refused (503), not
        # admitted. factory-gateway mints its task keys without max_budget
        # (its holds are the per-task budget), so the budget left here is
        # the proxy-wide max_budget below (user litellm-proxy-budget).
        fail_closed_budget_enforcement: true
      litellm_settings:
        # factory-gateway books a stream's cost from its final usage chunk
        include_cost_in_streaming_usage: true
        # proxy-wide stop behind the gateway's accounting (queue item 64 b):
        # every call is refused once the month's spend passes it (USD; 1mo
        # resets on the 1st, 00:00 UTC); the spend sits in user row
        # litellm-proxy-budget. A backstop only: 1.25 x the policy's
        # budget.month_eur, so the gateway's month cap stops first
        # (scripts/budget-backstop-check, run by config-check).
        max_budget: 680
        budget_duration: 1mo
    environmentSecrets:
      - litellm-qwen
      - litellm-zai
      - litellm-openai
    migrationJob:
      enabled: true
      hooks:
        argocd:
          enabled: false
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
