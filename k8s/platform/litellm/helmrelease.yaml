apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: litellm, namespace: flux-system}
spec:
  interval: 10m
  url: oci://ghcr.io/berriai/litellm-helm
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=1.102.1 <1.103.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: litellm, namespace: platform}
spec:
  interval: 10m
  releaseName: litellm
  targetNamespace: platform
  chartRef:
    kind: OCIRepository
    name: litellm
    namespace: flux-system
  values:
    replicaCount: 1
    masterkeySecretName: litellm-master-key
    db:
      deployStandalone: false
      useExisting: true
      endpoint: sf-cluster-rw.platform.svc
      database: litellm
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
      secret:
        name: pg-litellm
        usernameKey: username
        passwordKey: password
    proxyConfigMap:
      create: true
    proxy_config:
      model_list:
        - model_name: deepseek-chat
          litellm_params:
            model: deepseek/deepseek-chat
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: coding-cheap
          litellm_params:
            model: deepseek/deepseek-chat
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: coding-cheap
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            # opencode sends reasoning_effort, which dashscope rejects with a 400
            drop_params: true
            # Qwen thinks by default and its thinking is not bounded by
            # max_tokens (verified: max_tokens 60 gave 240 completion
            # tokens), so factory-gateway's output clamp would not hold
            extra_body:
              enable_thinking: false
        - model_name: coding-frontier
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
        - model_name: review-frontier
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            # opencode sends reasoning_effort, which zai rejects with a 400
            drop_params: true
        # factoryd's supervisor (architecture 6.6): the strongest configured model
        - model_name: supervisor
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            drop_params: true
        # Task 77 measurement candidates (scripts/model-tiers): removed again
        # when the tiers land
        - model_name: cand-zai-glm-5.3
          litellm_params:
            model: zai/glm-5.3
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            drop_params: true
        - model_name: cand-dashscope-qwen3.8-max
          litellm_params:
            model: dashscope/qwen3.8-max
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: cand-dashscope-kimi-k2.7-code
          litellm_params:
            model: dashscope/kimi-k2.7-code
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: cand-deepseek-v4-pro
          litellm_params:
            model: deepseek/deepseek-v4-pro
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: cand-groq-qwen3.8-27b
          litellm_params:
            model: groq/qwen/qwen3.8-27b
            api_key: os.environ/GROQ_KEY
            drop_params: true
        - model_name: cand-zai-glm-5
          litellm_params:
            model: zai/glm-5
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            drop_params: true
        - model_name: cand-zai-glm-4.7
          litellm_params:
            model: zai/glm-4.7
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            drop_params: true
        - model_name: cand-dashscope-qwen3.7-plus
          litellm_params:
            model: dashscope/qwen3.7-plus
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: cand-groq-gpt-oss-120b
          litellm_params:
            model: groq/openai/gpt-oss-120b
            api_key: os.environ/GROQ_KEY
            drop_params: true
        - model_name: cand-zai-glm-5.3-flash
          litellm_params:
            model: zai/glm-5.3-flash
            api_base: https://api.z.ai/api/paas/v4
            api_key: os.environ/Z_AI_KEY
            drop_params: true
        - model_name: cand-dashscope-qwen3.8-flash
          litellm_params:
            model: dashscope/qwen3.8-flash
            api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
            api_key: os.environ/ALIBABA_CLOUD_KEY
            drop_params: true
            extra_body:
              enable_thinking: false
        - model_name: cand-deepseek-flash
          litellm_params:
            model: deepseek/deepseek-flash
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: cand-groq-gpt-oss-20b
          litellm_params:
            model: groq/openai/gpt-oss-20b
            api_key: os.environ/GROQ_KEY
            drop_params: true
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        # backstop behind factory-gateway's holds: refuse a call whose
        # worst case does not fit the key's max_budget instead of shrinking
        # the reservation and admitting it
        fail_closed_budget_enforcement: true
      litellm_settings:
        # factory-gateway books a stream's cost from its final usage chunk
        include_cost_in_streaming_usage: true
    environmentSecrets:
      - litellm-deepseek
      - litellm-qwen
      - litellm-glm
      - litellm-groq
    migrationJob:
      enabled: true
      hooks:
        argocd:
          enabled: false
    service:
      type: ClusterIP
      port: 4000
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
