apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: openbao, namespace: flux-system}
spec:
  interval: 10m
  # the chart from the factory's store by its digest (the code
  # repository's upstream-images.txt, roadmap 203)
  url: oci://git.aisoftwarefactory.world/upstream/ghcr.io/openbao/charts/openbao
  ref: {digest: "sha256:98c8fc901e2579ac6da9a805537fcd7a19525ef8e563ae8737dc16fc8f641e3e"}
  secretRef: {name: forgejo-registry}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: openbao, namespace: platform}
spec:
  interval: 10m
  releaseName: openbao
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The wait passes the StatefulSet at once: under
  # updateStrategyType OnDelete it does not wait for the pod, which stays
  # sealed until a human unseals it.
  timeout: 5m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: platform
  chartRef: {kind: OCIRepository, name: openbao, namespace: flux-system}
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203); forgejo-registry reads it.
    global:
      imagePullSecrets: [{name: forgejo-registry}]
    injector:
      enabled: false
    server:
      image:
        registry: git.aisoftwarefactory.world/upstream/quay.io
        repository: openbao/openbao
        tag: "2.6.3@sha256:99c8dd178200d9a5f1a0420d6b1923514280e31e9271bdd92c69f765738c42aa"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "raft" {
              path = "/openbao/data"
            }
            service_registration "kubernetes" {}
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: local-path
        accessMode: ReadWriteOnce
        mountPath: /openbao/data
      auditStorage:
        enabled: false
      dev:
        enabled: false
      updateStrategyType: OnDelete
    ui:
      enabled: true
      serviceType: ClusterIP
      externalPort: 8200
