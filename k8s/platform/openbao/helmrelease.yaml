apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: openbao, namespace: flux-system}
spec: {interval: 10m, url: https://openbao.github.io/openbao-helm}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: openbao, namespace: platform}
spec:
  interval: 10m
  releaseName: openbao
  targetNamespace: platform
  chart:
    spec:
      chart: openbao
      version: 0.29.6
      sourceRef: {kind: HelmRepository, name: openbao, namespace: flux-system}
  values:
    injector:
      enabled: false
    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "raft" {
              path = "/openbao/data"
            }
            service_registration "kubernetes" {}
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: local-path
        accessMode: ReadWriteOnce
        mountPath: /openbao/data
      auditStorage:
        enabled: false
      dev:
        enabled: false
      updateStrategyType: OnDelete
    ui:
      enabled: true
      serviceType: ClusterIP
      externalPort: 8200
