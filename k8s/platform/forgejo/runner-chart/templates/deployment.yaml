---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forgejo-runner.fullname" . }}
  labels:
    {{- include "forgejo-runner.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "forgejo-runner.selectorLabels" . | nindent 6 }}
  # Recreate: a surge pod cannot schedule beside this one (the volume's
  # request fills the node) and both would poll one runner UUID from the
  # shared config. A rollout still kills an in-flight run; apply runner
  # changes between runs.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        config-hash: {{ toYaml .Values.runner.config.file | sha256sum }}
      labels:
        {{- /* no helm.sh/chart here: under reconcileStrategy Revision it
        carries the Flux revision, and every infra commit would restart
        the runner, killing its builds and wiping the dind cache */}}
        {{- include "forgejo-runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "forgejo-runner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: make-config-writeable
          {{- with .Values.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          command: [ "/bin/cp", "/etc/runner/.runner", "/data/.runner" ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/runner
      containers:
        - name: runner
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          command: 
            - "sh"
            - "-c"
            # sh as PID 1 ignores SIGTERM: trap it while waiting for dind,
            # then exec, so the runner itself gets the pod's SIGTERM
            - |
              trap 'exit 0' TERM INT
              while ! nc -z 127.0.0.1 2376 </dev/null; do
                echo 'waiting for docker daemon...';
                sleep 5;
              done
              exec /bin/forgejo-runner --config /etc/runner/config.yaml daemon
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            {{- if .Values.runner.pullSecret }}
            # the login forgejo-runner pulls the job images with
            - name: DOCKER_CONFIG
              value: /etc/docker-pull
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: runner-configfile
              mountPath: /etc/runner
            - name: docker-certs
              mountPath: /certs
            - name: runner-data
              mountPath: /data
            {{- if .Values.runner.pullSecret }}
            - name: docker-pull
              mountPath: /etc/docker-pull
              readOnly: true
            {{- end }}
        - name: dind
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.dind.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          resources:
            {{- with .Values.dind.resources }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.dind.prune }}
        - name: docker-prune
          {{- with $.Values.dind.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          # docker-prune.sh says what goes when
          command:
            - "sh"
            - "-c"
            - |
              {{- $.Files.Get "docker-prune.sh" | nindent 14 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          env:
            - name: KEEP
              value: {{ .keep | quote }}
            - name: EVERY
              value: {{ .everySeconds | quote }}
            - name: CHECK
              value: {{ required "dind.prune.checkSeconds: without it the size check would spin" .checkSeconds | quote }}
            - name: MAX_GIB
              value: {{ required "dind.prune.maxGiB: without it the size check would fail open" .maxGiB | quote }}
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            # the size check walks dind's store, as the kubelet does
            {{- $store := "" }}
            {{- range $.Values.volumeMounts }}
            {{- if eq .mountPath "/var/lib/docker" }}{{ $store = .name }}{{ end }}
            {{- end }}
            - name: {{ required "dind.prune: mount dind's /var/lib/docker from a volume (volumeMounts), the size check measures it" $store }}
              mountPath: /var/lib/docker
              readOnly: true
        {{- end }}
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: runner-config
          secret:
            secretName: {{ .Values.runner.config.existingSecret | default (print ( include "forgejo-runner.fullname" . ) "-config") | quote }}
        - name: runner-configfile
          secret:
            secretName: {{ include "forgejo-runner.fullname" . }}-configfile
        {{- with .Values.runner.pullSecret }}
        - name: docker-pull
          secret:
            secretName: {{ . }}
            items: [{key: .dockerconfigjson, path: config.json}]
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

