---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forgejo-runner.fullname" . }}
  labels:
    {{- include "forgejo-runner.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "forgejo-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        config-hash: {{ toYaml .Values.runner.config.file | sha256sum }}
      labels:
        {{- /* no helm.sh/chart here: under reconcileStrategy Revision it
        carries the Flux revision, and every infra commit would restart
        the runner, killing its builds and wiping the dind cache */}}
        {{- include "forgejo-runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "forgejo-runner.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: make-config-writeable
          {{- with .Values.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          command: [ "/bin/cp", "/etc/runner/.runner", "/data/.runner" ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/runner
      containers:
        - name: runner
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          command: 
            - "sh"
            - "-c"
            - |
              while ! nc -z 127.0.0.1 2376 </dev/null; do
                echo 'waiting for docker daemon...';
                sleep 5;
              done
              /bin/forgejo-runner --config /etc/runner/config.yaml daemon
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: runner-configfile
              mountPath: /etc/runner
            - name: docker-certs
              mountPath: /certs
            - name: runner-data
              mountPath: /data
        - name: dind
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.dind.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          resources:
            {{- with .Values.dind.resources }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.dind.prune }}
        - name: docker-prune
          {{- with $.Values.dind.image }}
          image: "{{ coalesce $.Values.global.image.registry .registry }}/{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ coalesce $.Values.global.image.pullPolicy .pullPolicy }}
          {{- end }}
          # Build cache goes by last use (builder prune's until), stopped
          # containers by age, images only when dangling: a base image pulled
          # today may be years old. Past maxGB of images plus build cache,
          # every unused image and all build cache go. Backs off while dind
          # is down; exits at once on SIGTERM.
          command:
            - "sh"
            - "-c"
            - |
              trap 'exit 0' TERM INT
              prune() {
                docker builder prune -af --filter "until=$KEEP" >/dev/null &&
                  docker container prune -f --filter "until=$KEEP" >/dev/null &&
                  docker image prune -f >/dev/null || return
                gb=$(docker system df --format '{{ "{{.Type}} {{.Size}}" }}' | awk '
                  $1 == "Images" || $1 " " $2 == "Build Cache" {
                    s = $NF; n = s + 0; sub(/^[0-9.]+/, "", s)
                    total += n * (s == "kB" ? 1e3 : s == "MB" ? 1e6 : s == "GB" ? 1e9 : s == "TB" ? 1e12 : 1)
                  }
                  END { printf "%d", total / 1e9 }') || return
                [ "$gb" -lt "$MAX_GB" ] || { docker image prune -af >/dev/null && docker builder prune -af >/dev/null; }
              }
              backoff=5
              while :; do
                prune & wait $!
                if [ $? -eq 0 ]; then
                  pause=$EVERY; backoff=5
                else
                  pause=$backoff; backoff=$((backoff * 2 > EVERY ? EVERY : backoff * 2))
                fi
                sleep "$pause" & wait $!
              done
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          env:
            - name: KEEP
              value: {{ .keep | quote }}
            - name: EVERY
              value: {{ .everySeconds | quote }}
            - name: MAX_GB
              value: {{ .maxGB | quote }}
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
        {{- end }}
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: runner-config
          secret:
            secretName: {{ .Values.runner.config.existingSecret | default (print ( include "forgejo-runner.fullname" . ) "-config") | quote }}
        - name: runner-configfile
          secret:
            secretName: {{ include "forgejo-runner.fullname" . }}-configfile
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

