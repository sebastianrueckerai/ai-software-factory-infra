apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: forgejo-runner, namespace: forgejo}
spec:
  interval: 10m
  releaseName: forgejo-runner
  targetNamespace: forgejo
  chart:
    spec:
      chart: ./k8s/platform/forgejo/runner-chart
      sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
      # an in-repo chart: rebuild it on every commit, not only when
      # Chart.yaml's version moves (a template change would else never ship);
      # the pod template carries no revision-stamped label, so a commit that
      # changes nothing in it restarts no runner
      reconcileStrategy: Revision
  values:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1536Mi
    dind:
      # main CI's jobs and image builds run in dind's cgroup. The
      # ephemeral-storage request is docker-data's sizeLimit: the scheduler
      # counts the volume against the node's allocatable, and under
      # DiskPressure the kubelet evicts pods past their requests first
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 40Gi
        limits:
          memory: 8Gi
      # a docker-prune sidecar keeps the build cache to a day's use and the
      # docker-data volume under maxGiB: unpruned, dind filled its 40Gi
      # volume and got evicted; checked hourly on images and build cache
      # alone, it let four main runs fill it in 45 minutes (2026-10-14)
      prune:
        keep: 24h
        everySeconds: 3600
        checkSeconds: 60
        # 40Gi less the most a main push run added and a margin. A run
        # (test, image, image-sandbox, image-runner) added up to 13.3 GiB
        # on a daemon pruned bare and 9.0 GiB warm (47 runs of 2026-10-13/14:
        # the pod's k8s.pod.filesystem.usage in SigNoz over each run's task
        # times in Forgejo); the first run with a buildkitd per image job
        # (roadmap 242) added 10.0 GiB warm, by du of the volume. The runner
        # takes one job at a time and pull requests build elsewhere, so one
        # run is the peak.
        maxGiB: 22
    runner:
      config:
        create: true
        existingInitSecret: runner-init
        file:
          runner:
            labels:
              - ubuntu-latest:docker://catthehacker/ubuntu:act-22.04
            envs:
              A_TEST_ENV_NAME_1: null
              A_TEST_ENV_NAME_2: null
              DOCKER_HOST: tcp://127.0.0.1:2376
              DOCKER_TLS_VERIFY: 1
              DOCKER_CERT_PATH: /certs/client
          container:
            network: host
            enable_ipv6: false
            privileged: false
            options: -v /certs/client:/certs/client
            valid_volumes:
              - /certs/client
    securityContext:
      privileged: true
    # dind's image store and build cache: an emptyDir the kubelet can see and
    # bound. The image's anonymous VOLUME /var/lib/docker was invisible to
    # eviction ranking and grew past 50 GiB on one node.
    volumeMounts:
      - name: docker-data
        mountPath: /var/lib/docker
    volumes:
      - name: docker-data
        emptyDir:
          sizeLimit: 40Gi
