apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: forgejo-runner, namespace: forgejo}
spec:
  interval: 10m
  releaseName: forgejo-runner
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. The config job runs before each upgrade, and
  # the runner waits for dind.
  timeout: 10m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: forgejo
  chart:
    spec:
      chart: ./k8s/platform/forgejo/runner-chart
      sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
      # an in-repo chart: rebuild it on every commit, not only when
      # Chart.yaml's version moves (a template change would else never ship);
      # the pod template carries no revision-stamped label, so a commit that
      # changes nothing in it restarts no runner
      reconcileStrategy: Revision
  values:
    # Every image from the factory's store by its digest (the code
    # repository's upstream-images.txt, roadmap 203), the job image too;
    # forgejo-registry reads it.
    image: {registry: git.aisoftwarefactory.world/upstream/code.forgejo.org, repository: forgejo/runner, tag: "12.7.3@sha256:4b0d1075b1ef22f9180776734d4a9f8f5f52eea836a28eec4c9c74429e4d6b2a"}
    imagePullSecrets: [{name: forgejo-registry}]
    kubectl:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: alpine/kubectl, tag: "1.36.1@sha256:2d03606ac3a584cc425218e563f4d1ea109eeccd9229c24e9f2eedaeda8f5c23"}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1536Mi
    dind:
      image: {registry: git.aisoftwarefactory.world/upstream/docker.io, repository: library/docker, tag: "29.5.2-dind@sha256:392437eb2d6e54f9ae2be9c0aac2cbca95e3f5eb9854b0f0b1d664d473856633"}
      # main CI's jobs and image builds run in dind's cgroup. The
      # ephemeral-storage request is docker-data's sizeLimit: the scheduler
      # counts the volume against the node's allocatable, and under
      # DiskPressure the kubelet evicts pods past their requests first.
      # It must stay under sf-1's EPHEMERAL 93 GiB less the 40Gi
      # systemReserved of talos/patches.yaml: 53 GiB allocatable once
      # that applies, 83.5 GiB until it does
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 50Gi
        limits:
          memory: 8Gi
      # a docker-prune sidecar keeps the build cache to a day's use and the
      # docker-data volume under maxGiB: unpruned, dind filled its 40Gi
      # volume and got evicted; checked hourly on images and build cache
      # alone, it let four main runs fill it in 45 minutes (2026-10-14)
      prune:
        keep: 24h
        everySeconds: 3600
        checkSeconds: 60
        # The ceiling less the most a main push run added and a margin. A
        # run (test, image, image-sandbox, image-runner) added up to 13.3
        # GiB on a daemon pruned bare and 9.0 GiB warm (47 runs of
        # 2026-10-13/14: the pod's k8s.pod.filesystem.usage in SigNoz over
        # each run's task times in Forgejo); the first run with a buildkitd
        # per image job (roadmap 242) added 10.0 GiB warm, by du of the
        # volume. The runner takes one job at a time and pull requests
        # build elsewhere, so one run is the peak. 2026-10-19: hourly rolls
        # left the floor near 30 GiB — cache and images the emergency
        # prune could not reach before the next run started — and 22 + a
        # run crossed 40 mid-test and evicted the runner (on a fresh
        # volume that evening the test job alone held 14.5 GiB). 30 + 13.3
        # leaves 6.7 of the 50.
        maxGiB: 30
    runner:
      pullSecret: forgejo-registry
      config:
        create: true
        existingInitSecret: runner-init
        file:
          runner:
            labels:
              - ubuntu-latest:docker://git.aisoftwarefactory.world/upstream/docker.io/catthehacker/ubuntu:act-22.04@sha256:a03f9d3c8f0930dbf586cf375d09ff2a3718ee794a77d2b635f1a0dd79095488
            envs:
              A_TEST_ENV_NAME_1: null
              A_TEST_ENV_NAME_2: null
              DOCKER_HOST: tcp://127.0.0.1:2376
              DOCKER_TLS_VERIFY: 1
              DOCKER_CERT_PATH: /certs/client
          container:
            network: host
            enable_ipv6: false
            privileged: false
            options: -v /certs/client:/certs/client
            valid_volumes:
              - /certs/client
    securityContext:
      privileged: true
    # dind's image store and build cache: an emptyDir the kubelet can see and
    # bound. The image's anonymous VOLUME /var/lib/docker was invisible to
    # eviction ranking and grew past 50 GiB on one node.
    volumeMounts:
      - name: docker-data
        mountPath: /var/lib/docker
    volumes:
      - name: docker-data
        emptyDir:
          sizeLimit: 50Gi
