apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: forgejo, namespace: flux-system}
spec:
  interval: 10m
  # the chart from the factory's store by its digest (the code
  # repository's upstream-images.txt, roadmap 203); the re-seed installs it
  # from its upstream before the store serves (docs/reseed-runbook.md)
  url: oci://git.aisoftwarefactory.world/upstream/code.forgejo.org/forgejo-helm/forgejo
  ref: {digest: "sha256:f5044e73361f5991978f1bc281a570bf893fd0f468e7d76274a7853eb27428cf"}
  secretRef: {name: forgejo-registry}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: forgejo, namespace: forgejo}
spec:
  interval: 10m
  releaseName: forgejo
  # A failed install is uninstalled and installed again, a failed upgrade
  # rolled back and tried again, three times each: without retries a failed
  # release stalls for good. It was ready 16 s after the 2026-10-13 re-seed
  # install.
  timeout: 5m
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  targetNamespace: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  values:
    # Pinned by digest at the upstream: Forgejo serves the factory's store,
    # so it cannot start from it (the code repository's upstream-images.txt
    # marks it bootstrap).
    image: {tag: "15.0.9", digest: "sha256:e0950cca25a2344f0f519b9aff894bcfa80b53601b24f07066d6625033597b55"}
    replicaCount: 1
    resources:
      requests: {memory: 768Mi}
      limits: {memory: 2560Mi}
    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path
    service:
      http:
        type: ClusterIP
        port: 3000
    gitea:
      admin:
        # factory-admin, the machine admin every tool logs in as (ruling 229);
        # an email no other account holds, or the init fails
        existingSecret: forgejo-admin-secret
        email: factory-admin@aisoftwarefactory.world
        passwordMode: keepUpdated
      config:
        server:
          ROOT_URL: https://git.aisoftwarefactory.world/
          DOMAIN: git.aisoftwarefactory.world
          SSH_DOMAIN: git.aisoftwarefactory.world
        database:
          DB_TYPE: postgres
          HOST: sf-cluster-rw.platform.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
        storage:
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: fsn1.your-objectstorage.com
          MINIO_USE_SSL: true
          MINIO_BUCKET: aisoftwarefactory-forgejo
          MINIO_LOCATION: fsn1
          MINIO_BUCKET_LOOKUP: auto
        packages:
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: fsn1.your-objectstorage.com:443
          MINIO_USE_SSL: true
          MINIO_BUCKET: aisoftwarefactory-forgejo
          MINIO_LOCATION: fsn1
          MINIO_BUCKET_LOOKUP: auto
        service:
          # accounts are made by the admin only (ruling 144), outsiders' test
          # accounts too. Item 138 held nothing readable without a login until
          # the store's packages needed anonymous build reads (Sebastian,
          # 2026-10-16): the upstream org is public, every code repo and org
          # stays private, registration stays off
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: false
        actions:
          ENABLED: true
          DEFAULT_ACTIONS_URL: https://data.forgejo.org
        webhook:
          # task 42: factoryd's own webhook intake is a private in-cluster
          # host, which Forgejo's SSRF guard blocks unless allow-listed
          # alongside the public hosts webhooks already need.
          ALLOWED_HOST_LIST: "external,factoryd.factory.svc.cluster.local"
      additionalConfigFromEnvs:
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef: {name: forgejo-db-creds, key: password}
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: access-key}
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: secret-key}
        - name: FORGEJO__packages__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: access-key}
        - name: FORGEJO__packages__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: secret-key}
        - name: FORGEJO__security__SECRET_KEY
          valueFrom:
            secretKeyRef: {name: forgejo-secret-key, key: SECRET_KEY}
