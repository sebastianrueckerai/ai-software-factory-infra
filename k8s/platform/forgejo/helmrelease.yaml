apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: forgejo, namespace: flux-system}
spec:
  interval: 10m
  url: oci://code.forgejo.org/forgejo-helm/forgejo
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=17.1.7 <17.1.8"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: forgejo, namespace: forgejo}
spec:
  interval: 10m
  releaseName: forgejo
  targetNamespace: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: flux-system
  values:
    replicaCount: 1
    resources:
      requests: {memory: 768Mi}
      limits: {memory: 2560Mi}
    persistence:
      enabled: true
      size: 10Gi
      storageClass: local-path
    service:
      http:
        type: ClusterIP
        port: 3000
    gitea:
      admin:
        # factory-admin, the machine admin every tool logs in as (ruling 229);
        # an email no other account holds, or the init fails
        existingSecret: forgejo-admin-secret
        email: factory-admin@aisoftwarefactory.world
        passwordMode: keepUpdated
      config:
        server:
          ROOT_URL: https://git.aisoftwarefactory.world/
          DOMAIN: git.aisoftwarefactory.world
          SSH_DOMAIN: git.aisoftwarefactory.world
        database:
          DB_TYPE: postgres
          HOST: sf-cluster-rw.platform.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
        storage:
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: fsn1.your-objectstorage.com
          MINIO_USE_SSL: true
          MINIO_BUCKET: aisoftwarefactory-forgejo
          MINIO_LOCATION: fsn1
          MINIO_BUCKET_LOOKUP: auto
        packages:
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: fsn1.your-objectstorage.com:443
          MINIO_USE_SSL: true
          MINIO_BUCKET: aisoftwarefactory-forgejo
          MINIO_LOCATION: fsn1
          MINIO_BUCKET_LOOKUP: auto
        service:
          # accounts are made by the admin only (ruling 144), outsiders' test accounts too
          DISABLE_REGISTRATION: true
        actions:
          ENABLED: true
          DEFAULT_ACTIONS_URL: https://data.forgejo.org
        webhook:
          # task 42: factoryd's own webhook intake is a private in-cluster
          # host, which Forgejo's SSRF guard blocks unless allow-listed
          # alongside the public hosts webhooks already need.
          ALLOWED_HOST_LIST: "external,factoryd.factory.svc.cluster.local"
      additionalConfigFromEnvs:
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef: {name: forgejo-db-creds, key: password}
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: access-key}
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: secret-key}
        - name: FORGEJO__packages__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: access-key}
        - name: FORGEJO__packages__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: hetzner-s3-creds, key: secret-key}
        - name: FORGEJO__security__SECRET_KEY
          valueFrom:
            secretKeyRef: {name: forgejo-secret-key, key: SECRET_KEY}
