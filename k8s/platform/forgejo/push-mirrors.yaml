# Keeps one healthy push mirror to GitHub per factory repository (the
# off-site backup); push-mirrors.sh says how. The GitHub token is
# secret github-mirror (scripts/seed-secrets.sh, fine-grained, the two
# repositories, contents read and write). After a token
# rotation the old mirror fails its next sync and the next run recreates it.
apiVersion: batch/v1
kind: CronJob
metadata: {name: push-mirrors, namespace: forgejo}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets: [{name: forgejo-registry}]
          containers:
            - name: mirrors
              # pin docker.io/alpine/k8s
              image: git.aisoftwarefactory.world/upstream/docker.io/alpine/k8s:1.36.6@sha256:2b33c17a9e7fa4a7bc25b3194fefbc3363c863e6c073a5a81bf07fb00b99d92b
              command: [sh, /scripts/push-mirrors.sh]
              env:
                - name: FORGEJO_USER
                  valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: username}}
                - name: FORGEJO_PASSWORD
                  valueFrom: {secretKeyRef: {name: forgejo-admin-secret, key: password}}
                - name: GITHUB_TOKEN
                  valueFrom: {secretKeyRef: {name: github-mirror, key: token, optional: true}}
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: push-mirrors-script}
            - name: tmp
              emptyDir: {}
