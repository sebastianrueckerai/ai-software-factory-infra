apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: forgejo
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: git.aisoftwarefactory.world
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-aisoftwarefactory-world-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.aisoftwarefactory.world
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: console-aisoftwarefactory-world-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: factory}
    - name: https-signoz
      protocol: HTTPS
      port: 443
      hostname: signoz.aisoftwarefactory.world
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: signoz-aisoftwarefactory-world-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {kubernetes.io/metadata.name: platform}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-redirect
  namespace: forgejo
spec:
  parentRefs:
    - name: edge-gateway
      sectionName: http
  hostnames: [git.aisoftwarefactory.world, console.aisoftwarefactory.world, signoz.aisoftwarefactory.world]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-app
  namespace: forgejo
spec:
  parentRefs:
    - name: edge-gateway
      sectionName: https
  hostnames: [git.aisoftwarefactory.world]
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: edge-gateway
                namespace: forgejo
                kind: Gateway
            serviceType: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-aisoftwarefactory-world
  namespace: forgejo
spec:
  secretName: git-aisoftwarefactory-world-tls
  dnsNames: [git.aisoftwarefactory.world]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-aisoftwarefactory-world
  namespace: forgejo
spec:
  secretName: console-aisoftwarefactory-world-tls
  dnsNames: [console.aisoftwarefactory.world]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: signoz-aisoftwarefactory-world
  namespace: forgejo
spec:
  secretName: signoz-aisoftwarefactory-world-tls
  dnsNames: [signoz.aisoftwarefactory.world]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
# SigNoz has its own login; the admin account exists before this route does
# (self-registration closes after the first account).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz
  namespace: platform
spec:
  parentRefs:
    - name: edge-gateway
      namespace: forgejo
      sectionName: https-signoz
  hostnames: [signoz.aisoftwarefactory.world]
  rules:
    - backendRefs:
        - name: signoz
          port: 8080
