apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: forgejo
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: git.aisoftwarefactory.world
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-aisoftwarefactory-world-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-redirect
  namespace: forgejo
spec:
  parentRefs:
    - name: edge-gateway
      sectionName: http
  hostnames: [git.aisoftwarefactory.world]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-app
  namespace: forgejo
spec:
  parentRefs:
    - name: edge-gateway
      sectionName: https
  hostnames: [git.aisoftwarefactory.world]
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: edge-gateway
                namespace: forgejo
                kind: Gateway
            serviceType: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-aisoftwarefactory-world
  namespace: forgejo
spec:
  secretName: git-aisoftwarefactory-world-tls
  dnsNames: [git.aisoftwarefactory.world]
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
