# The per-project caches (Go, npm) of agent sessions and CI runs: a claim
# cache-<project> or cache-ci-<project> in each short-lived namespace lands
# in the same node directory, which Retain keeps when the namespace goes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: factory-cache
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  pathPattern: "{{ .PVC.Name }}"
