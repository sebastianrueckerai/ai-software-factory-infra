apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
# pin copy local-path-provisioner
- local-path-storage.yaml
- factory-cache.yaml
- factory-cache-sweep.yaml
# Pinned by digest at the upstream: local-path serves the volumes Forgejo
# runs on, so it cannot start from the store.
images:
# pin docker.io/rancher/local-path-provisioner
- {name: rancher/local-path-provisioner, newName: docker.io/rancher/local-path-provisioner, newTag: "v0.0.31@sha256:5fb0394abf87407a27cc56db94334eb0c92d0b5de2636683a7ec51f38143dfc9"}
patches:
# The upstream Deployment sets no resources, so the provisioner ran
# BestEffort, the class Talos's OOM controller kills first under node memory
# pressure. 96Mi is twice its 48 MiB peak of 2026-11-12; no limit.
- patch: |-
    kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: local-path-provisioner
      namespace: local-path-storage
    spec:
      template:
        spec:
          containers:
          - name: local-path-provisioner
            resources:
              requests: {cpu: 10m, memory: 96Mi}
- patch: |-
    kind: ConfigMap
    apiVersion: v1
    metadata:
      name: local-path-config
      namespace: local-path-storage
    data:
      config.json: |-
        {
                "nodePathMap":[],
                "storageClassConfigs":{
                        "local-path":{
                                "nodePathMap":[
                                {
                                        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                                        "paths":["/var/mnt/local-path-provisioner"]
                                }
                                ]
                        },
                        "factory-cache":{
                                "nodePathMap":[
                                {
                                        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                                        "paths":["/var/lib/factory-cache"]
                                }
                                ]
                        }
                }
        }
      # The helper pod's image lives in a string the images transformer does
      # not read, so it stands here on one marked line.
      # pin docker.io/library/busybox
      helperPod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: helper-pod\nspec:\n  priorityClassName: system-node-critical\n  tolerations:\n    - key: node.kubernetes.io/disk-pressure\n      operator: Exists\n      effect: NoSchedule\n  containers:\n  - name: helper-pod\n    image: docker.io/library/busybox:1.38.0@sha256:f97baa533a26513c453a362be331a43eb60214302f449c16571b23cea141dce4\n    imagePullPolicy: IfNotPresent"
- patch: |-
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: local-path
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
- patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: local-path-storage
      labels:
        pod-security.kubernetes.io/enforce: privileged
configMapGenerator:
- name: local-path-config
  namespace: local-path-storage
  behavior: merge
  files: [setup=setup.sh]
  options:
    disableNameSuffixHash: true
- name: factory-cache-sweep-script
  namespace: local-path-storage
  files: [setup.sh]
