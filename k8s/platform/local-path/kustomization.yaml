apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- upstream-v0.0.31.yaml
- factory-cache.yaml
- factory-cache-sweep.yaml
patches:
# The upstream Deployment sets no resources, so the provisioner ran
# BestEffort, the class Talos's OOM controller kills first under node memory
# pressure. 96Mi is twice its 48 MiB peak of 2026-11-12; no limit.
- patch: |-
    kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: local-path-provisioner
      namespace: local-path-storage
    spec:
      template:
        spec:
          containers:
          - name: local-path-provisioner
            resources:
              requests: {cpu: 10m, memory: 96Mi}
- patch: |-
    kind: ConfigMap
    apiVersion: v1
    metadata:
      name: local-path-config
      namespace: local-path-storage
    data:
      config.json: |-
        {
                "nodePathMap":[],
                "storageClassConfigs":{
                        "local-path":{
                                "nodePathMap":[
                                {
                                        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                                        "paths":["/var/mnt/local-path-provisioner"]
                                }
                                ]
                        },
                        "factory-cache":{
                                "nodePathMap":[
                                {
                                        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                                        "paths":["/var/lib/factory-cache"]
                                }
                                ]
                        }
                }
        }
- patch: |-
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: local-path
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
- patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: local-path-storage
      labels:
        pod-security.kubernetes.io/enforce: privileged
configMapGenerator:
- name: local-path-config
  namespace: local-path-storage
  behavior: merge
  files: [setup=setup.sh]
  options:
    disableNameSuffixHash: true
- name: factory-cache-sweep-script
  namespace: local-path-storage
  files: [setup.sh]
