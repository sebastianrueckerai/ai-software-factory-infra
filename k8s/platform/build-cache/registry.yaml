# The PR image builds' read-only layer cache (ruling 111): main CI exports
# each image's BuildKit cache here, the untrusted PR runner pods read it.
# No credential anywhere; policy.yaml is the access control. Plain HTTP,
# in-cluster only. Disposable: after a rebuild it starts empty and the next
# main CI run refills it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: build-cache, namespace: forgejo}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: build-cache, namespace: forgejo}
spec:
  replicas: 1
  # the garbage collector must not run while a registry serves the volume
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: build-cache}
  template:
    metadata:
      labels: {app.kubernetes.io/name: build-cache}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets: [{name: forgejo-registry}]
      initContainers:
        # every start sweeps the blobs no tag reaches any more; gc.yaml
        # restarts the pod daily. An empty store has nothing to mark and
        # would fail the collector.
        - name: garbage-collect
          image: git.aisoftwarefactory.world/upstream/docker.io/library/registry:3@sha256:21078ecfcba8a0cd7e1a384f75b3509899661dd21823bf1da21b5a4674aaceb9
          command: [/bin/sh, -c]
          args:
            - >-
              [ ! -d /var/lib/registry/docker/registry/v2/repositories ] ||
              exec registry garbage-collect --delete-untagged /etc/distribution/config.yml
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          env:
            - {name: REGISTRY_LOG_LEVEL, value: warn}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      containers:
        - name: registry
          image: git.aisoftwarefactory.world/upstream/docker.io/library/registry:3@sha256:21078ecfcba8a0cd7e1a384f75b3509899661dd21823bf1da21b5a4674aaceb9
          env:
            - {name: REGISTRY_LOG_LEVEL, value: info}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "false"}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /v2/, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext: *restricted
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: build-cache}
---
apiVersion: v1
kind: Service
metadata: {name: build-cache, namespace: forgejo}
spec:
  selector: {app.kubernetes.io/name: build-cache}
  ports: [{name: http, port: 5000, targetPort: http}]
