apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sf-cluster
  namespace: platform
spec:
  instances: 3
  # Pinned by digest at the upstream (the code repository's
  # upstream-images.txt, bootstrap): Forgejo's database starts before the
  # factory's store can serve, and the operator's default names a tag CNPG
  # rebuilds.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:4c43fe40a7315223ff869fe6519520c4776fce5097b54e0bc6e0eb2c79c702b6
  superuserSecret:
    name: sf-cluster-superuser
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
  # The limit covers the configured worst case: shared_buffers 128 MiB plus
  # 200 connections with a 4 MiB work_mem each and their backend overhead.
  resources:
    requests: {memory: 384Mi}
    limits: {memory: 1536Mi}
  storage:
    storageClass: local-path
    size: 20Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: sf-cluster-objectstore
          serverName: sf-cluster-v15
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sf-cluster-objectstore
        serverName: sf-cluster-v16
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-forgejo
      - name: litellm
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-litellm
      - name: temporal
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-temporal
