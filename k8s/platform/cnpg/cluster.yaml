apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sf-cluster
  namespace: platform
spec:
  instances: 3
  superuserSecret:
    name: sf-cluster-superuser
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
  # The limit covers the configured worst case: shared_buffers 128 MiB plus
  # 200 connections with a 4 MiB work_mem each and their backend overhead.
  resources:
    requests: {memory: 384Mi}
    limits: {memory: 1536Mi}
  storage:
    storageClass: local-path
    size: 20Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: sf-cluster-objectstore
          serverName: sf-cluster-v9
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sf-cluster-objectstore
        serverName: sf-cluster-v10
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-forgejo
      - name: litellm
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-litellm
      - name: temporal
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-temporal
