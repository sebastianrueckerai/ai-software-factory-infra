apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sf-cluster
  namespace: platform
spec:
  instances: 3
  superuserSecret:
    name: sf-cluster-superuser
  enableSuperuserAccess: true
  storage:
    storageClass: local-path
    size: 20Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-secret
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-forgejo
      - name: litellm
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-litellm
      - name: temporal
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: pg-temporal
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://aisoftwarefactory-backups/cnpg/sf-cluster
      endpointURL: https://fsn1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
