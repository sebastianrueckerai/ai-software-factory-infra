apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: sf-cluster-daily, namespace: platform}
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: sf-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
