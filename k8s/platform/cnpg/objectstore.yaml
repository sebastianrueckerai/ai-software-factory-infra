apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: sf-cluster-objectstore
  namespace: platform
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://aisoftwarefactory-backups/cnpg/sf-cluster
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 4
