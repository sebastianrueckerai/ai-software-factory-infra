apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
# pin copy barman-manifest
- manifest.yaml
# Pinned by digest at the upstream: the plugin runs before the store can
# serve.
images:
# pin ghcr.io/cloudnative-pg/plugin-barman-cloud
- {name: ghcr.io/cloudnative-pg/plugin-barman-cloud, newTag: "v0.15.0@sha256:fe3bad8f38ef45e53e18b8b85fd0427b8b25c09bcd4e2068a04f3ff493ce1afc"}
patches:
# The manifest's Secret holds the sidecar image as base64, which no marker
# can carry; stringData holds it as one plain line, and the API server
# stores the same bytes. The Secret's name carries a hash that changes with
# each version, so the patch selects it by prefix.
- target: {kind: Secret, name: "plugin-barman-cloud-.*", namespace: cnpg-system}
  patch: |-
    - op: remove
      path: /data
    - op: add
      path: /stringData
      value:
        # pin ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar
        SIDECAR_IMAGE: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.0@sha256:7b3069c61e5678a2fd05dd937ef47e0337bfbac1c05f1e1051901b9a7d54b391
# The plugin's upstream Deployment sets no resources, so it ran BestEffort,
# the class Talos's OOM controller kills first under node memory pressure,
# and with it the database backups. 128Mi is twice its 61 MiB peak of
# 2026-11-12; no limit, so no new kill at its own bound.
- patch: |-
    kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: barman-cloud
      namespace: cnpg-system
    spec:
      template:
        spec:
          containers:
          - name: barman-cloud
            resources:
              requests: {cpu: 10m, memory: 128Mi}
